name: Sync with upstream OsmAnd

# Imports new commits from the repository this fork is based on.
#
# master is a MIRROR. The fork's own work lives on dev; master carries upstream plus this one
# workflow file, and nothing else. Critically, build-dev.yml - the workflow that holds the
# Places key and, for tags, the release keystore - is not on master and does not trigger on it
# (`push: branches: [dev], tags: v*`). So upstream code landing on master cannot reach a runner
# holding this fork's secrets, and there is nothing on master for a human to review that they
# did not already get from upstream.
#
#   master -> PUSHED DIRECTLY. No sync branch, no pull request, nothing to click.
#   dev    -> the review gate lives here, because dev is what actually builds:
#
#              Touches nothing CI executes  -> PUSHED DIRECTLY too. No branch, no PR.
#              Touches a build script, the  -> parked on sync/upstream-dev and reported on a
#              Gradle wrapper or a workflow    tracking ISSUE naming the executable files.
#                                              Gradle runs arbitrary code out of every
#                                              *.gradle file it loads, and merging is what
#                                              puts that code on a runner holding the keys.
#
# NOTHING HERE OPENS A PULL REQUEST, and that is not a style preference. Six consecutive
# scheduled runs failed at `gh pr create` - every run between 2026-08-04 and 2026-08-09 -
# so the daily sync had never once worked and upstream reached this fork only when the
# owner merged it by hand in the web UI. The cause is a repository setting invisible from
# inside a workflow ("Allow GitHub Actions to create and approve pull requests"), which no
# `permissions:` block overrides. Issues are not subject to it, so the review path uses one.
#
# That split is the point: the overwhelming majority of upstream commits are Java, Kotlin
# and translations, which can only break the app - and the build catches that. The handful
# that can actually attack the repository are the ones a human should look at, and they reach
# a runner only through dev.
#
# WHERE THIS FILE HAS TO LIVE
#   On the DEFAULT branch, or the schedule below never fires. GitHub reads `schedule:`
#   triggers only from the default branch's copy of a workflow - a cron sitting on a
#   feature branch is silently inert, with no error anywhere to say so. This fork learned
#   that the hard way: the file lived only on dev for its first weeks and the daily sync
#   never ran once. Keep it on master.
#
#   upstream/master --merge--> master        (direct push, always)
#                                  |
#                                  +--merge--> sync/upstream-dev --PR--> dev
#
# Why dev still goes through a pull request (2026-07 supply-chain review):
#
#   Gradle executes arbitrary code out of every *.gradle file it loads. An older version of
#   this workflow pushed unreviewed upstream commits straight to master AND dev and then
#   dispatched build-dev.yml, which at the time held the release keystore, all three of its
#   credentials and the Google Places key. A single added line in any upstream build script
#   would therefore have run against this fork's production signing material within 24 hours
#   of being committed, with nobody having looked at it.
#
#   A pull request puts a human in that gap. This workflow no longer dispatches any build
#   either, so upstream code cannot reach a runner holding secrets until someone merges
#   the dev PR - and the signing keys have moved out of ordinary dev builds entirely, into a
#   tag-triggered job behind the `production` environment. See .github/CICD.md.
#
#   The master side needs none of that, and giving it a pull request anyway was ceremony: the
#   clean case self-merged, and it left a branch and a closed PR behind every single day for a
#   branch that is a mirror and is never built with a key.
#
# If either merge conflicts the workflow aborts that merge, leaves the branch alone, and
# reports the conflicting paths on a tracking issue instead of offering a half-resolved
# tree for review. A master conflict should be close to impossible now - the only fork
# content there is this file - and if one ever happens it is worth reading rather than
# resolving on autopilot.

on:
  schedule:
    # 03:17 UTC daily - off the hour so it does not queue behind everyone else's
    # midnight cron jobs.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_repository:
        # A `choice` rather than free text, and the allow-list is re-checked at run time
        # below. This input used to accept any repository on GitHub, which - on a workflow
        # that reached the signing keys - meant anyone with write access could have this
        # fork import and build code from a repository they controlled.
        description: 'Upstream repository to sync from (allow-listed)'
        type: choice
        required: false
        default: 'osmandapp/OsmAnd'
        options:
          - osmandapp/OsmAnd
      upstream_branch:
        description: 'Upstream branch to sync from (e.g. master, or a release branch)'
        required: false
        default: 'master'

permissions:
  # Pushes master directly and pushes the dev sync branch. It cannot be narrowed further -
  # GITHUB_TOKEN has no per-branch scope - so dev is protected by branch protection instead;
  # see the repository settings checklist in .github/CICD.md.
  #
  # NOTE if master is branch-protected: this job needs to be allowed to push it, or the daily
  # mirror stops and says so in the run summary rather than failing loudly.
  contents: write
  # Open and refresh the sync pull requests.
  pull-requests: write
  # File the conflict tracking issue.
  issues: write
  # `actions: write` was dropped together with the build dispatch: this workflow must not
  # be able to start a build of the code it just imported.

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'osmandapp/OsmAnd' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
  ALLOWED_UPSTREAM_REPOSITORIES: 'osmandapp/OsmAnd'
  MAIN_BRANCH: master
  DEV_BRANCH: dev
  # dev only. master is pushed directly and never gets a sync branch. Stable name so an
  # unmerged dev sync PR is refreshed in place rather than a new one opened daily.
  DEV_SYNC_BRANCH: sync/upstream-dev
  BOT_NAME: 'cairodrive-sync[bot]'
  BOT_EMAIL: 'cairodrive-sync[bot]@users.noreply.github.com'

jobs:
  sync:
    name: Propose upstream merge as pull requests
    runs-on: ubuntu-latest

    steps:
      # Before the checkout, so a rejected source never gets as far as being fetched.
      - name: Validate sync source
        run: |
          set -euo pipefail
          allowed=false
          for repo in ${ALLOWED_UPSTREAM_REPOSITORIES}; do
            if [ "${repo}" = "${UPSTREAM_REPOSITORY}" ]; then
              allowed=true
            fi
          done
          if [ "${allowed}" != "true" ]; then
            echo "::error::${UPSTREAM_REPOSITORY} is not in the allow-list (${ALLOWED_UPSTREAM_REPOSITORIES}). Add it to ALLOWED_UPSTREAM_REPOSITORIES and to the dispatch input options if it really belongs there."
            exit 1
          fi
          # The branch name is free text and ends up in a git refspec and a remote URL.
          # Anything outside this character set is rejected rather than quoted around,
          # which also rules out ref names that git itself would treat as options.
          if ! printf '%s' "${UPSTREAM_BRANCH}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::Refusing branch name '${UPSTREAM_BRANCH}': letters, digits, dot, underscore, slash and dash only."
            exit 1
          fi
          echo "Syncing from ${UPSTREAM_REPOSITORY}#${UPSTREAM_BRANCH}."

      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          # Full history: the merges below need the whole graph, and the force-push guard
          # reads the current tip of the sync branches from the remote refs.
          fetch-depth: 0
          # Needed here, unlike in build-dev.yml: this job pushes the sync branches. It
          # never runs a build tool, so nothing untrusted shares the runner with the token.
          persist-credentials: true

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            if git fetch --no-tags upstream "${UPSTREAM_BRANCH}"; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "::error::Could not fetch ${UPSTREAM_REPOSITORY}#${UPSTREAM_BRANCH} after 4 attempts"
              exit 1
            fi
            sleep $((2 ** attempt))
          done
          echo "upstream_sha=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into ${{ env.MAIN_BRANCH }}
        id: merge_main
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          git checkout -B "${MAIN_BRANCH}" "origin/${MAIN_BRANCH}"
          before="$(git rev-parse HEAD)"
          behind="$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")"
          echo "new_commits=${behind}" >> "$GITHUB_OUTPUT"

          if [ "${behind}" = "0" ]; then
            {
              echo "conflict=false"
              echo "changed=false"
            } >> "$GITHUB_OUTPUT"
            echo "Already up to date with ${UPSTREAM_REPOSITORY}#${UPSTREAM_BRANCH}."
            exit 0
          fi

          # --no-ff on purpose, even when the merge could fast-forward. Two reasons: the
          # import stays one reviewable commit on top of the branch point, and the tip of
          # the sync branch is then always authored by this bot - which is exactly what the
          # force-push guard in the next step keys on to tell its own work apart from a
          # human's conflict resolution.
          if git merge --no-ff --no-edit \
              -m "Merge ${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH} into ${MAIN_BRANCH}" \
              "upstream/${UPSTREAM_BRANCH}"; then
            {
              echo "conflict=false"
              echo "changed=true"
            } >> "$GITHUB_OUTPUT"

            files="$(git diff --name-only "${before}" HEAD)"
            file_count="$(printf '%s\n' "${files}" | grep -c . || true)"
            # Files CI executes. A line added to any of them runs with whatever credentials
            # the workflow reading them holds, so they are hoisted to the top of the PR
            # body: they are the only part of an upstream import that can attack this
            # repository rather than merely break it.
            # ALLOW-LIST, not a deny-list. The deny-list this replaces listed the build files
            # someone thought of - *.gradle, *.properties, the wrapper, .github/workflows - and
            # silently auto-merged everything else. It missed OsmAnd/old-ndk-build.sh, which
            # build-common.gradle executes via `bash`, and OsmAnd/jni/*.mk, which are fed to
            # ndk-build (GNU make, which runs $(shell ...)). An upstream edit to any of those
            # would have merged itself onto a branch whose next build runs with this fork's
            # Places key, and the pull request would have said "no build scripts in this import".
            #
            # Inverting it fixes the whole class rather than the three instances: content types
            # that cannot execute are named explicitly, and ANYTHING else - a file extension
            # nobody has thought of yet - waits for a human. That is the failure direction to
            # choose when the cost of being wrong is a signing key.
            executable="$(printf '%s\n' "${files}" \
              | grep -vE '\.(java|kt|xml|json|txt|md|png|webp|jpe?g|gif|svg|ttf|otf)$' || true)"
            # An import that changes nothing CI executes cannot attack this repository - it can
            # only break the app, which the build catches. Those merge themselves. Anything that
            # touches a build script, the Gradle wrapper or a workflow waits for a human, because
            # merging it is what puts that code on a runner.
            if [ -n "${executable}" ]; then
              echo "automerge=false" >> "$GITHUB_OUTPUT"
            else
              echo "automerge=true" >> "$GITHUB_OUTPUT"
            fi
            {
              echo "Merges \`${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}\` (\`${UPSTREAM_SHA}\`) into \`${MAIN_BRANCH}\`."
              echo
              echo "- **${behind}** new upstream commits, **${file_count}** files changed"
              echo "- Merged cleanly - no conflicts"
              echo "- Opened by [this workflow run](${RUN_URL})"
              echo
              if [ -n "${executable}" ]; then
                echo "### :warning: This import changes files that CI executes"
                echo
                echo "Read these before anything else. Gradle runs arbitrary code from any"
                echo "build script it loads, and a merge of this PR is what lets that code"
                echo "onto a runner. Nothing here is signed or trusted upstream."
                echo
                echo '```'
                printf '%s\n' "${executable}"
                echo '```'
              else
                echo "### Nothing executable in this import"
                echo
                echo "Every changed file is source, markup or an image - nothing CI can run."
                echo "Merged automatically."
              fi
              echo
              echo "### Upstream commits"
              echo
              git log --no-merges --max-count=50 --format='- `%h` %s' "${before}..HEAD"
              if [ "${behind}" -gt 50 ]; then
                echo "- ... and $(( behind - 50 )) more"
              fi
            } > "${RUNNER_TEMP}/pr-body-main.md"
          else
            {
              echo "conflict=true"
              echo "changed=false"
              # Random delimiter: the interpolated values are upstream-controlled file
              # names, and a file literally called CONFLICT_EOF would close the heredoc
              # early and let the remaining paths be parsed as further key=value outputs -
              # which drive the `if:` conditions below.
              delimiter="EOF_$(openssl rand -hex 16)"
              echo "conflicts<<${delimiter}"
              git diff --name-only --diff-filter=U
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "::warning::Conflicts merging upstream into ${MAIN_BRANCH}; no pull request opened."
          fi
          exit 0

      - name: Push ${{ env.MAIN_BRANCH }}
        id: push_main
        if: steps.merge_main.outputs.changed == 'true'
        run: |
          set -uo pipefail
          # STRAIGHT TO master. No sync branch, no pull request.
          #
          # master is a mirror: the only fork content on it is this workflow file, and
          # build-dev.yml - which holds the Places key and, on a tag, the release keystore - is
          # neither on master nor triggered by it. So an import here cannot reach a runner
          # holding this fork's secrets, and there is nothing on it for a human to review that
          # they would not be reviewing upstream. The gate that matters lives on the dev side
          # below, because dev is what actually builds.
          #
          # Fast-forward push, never --force. If master has moved under us the push fails, this
          # run reports it and tomorrow's run merges again from the new tip - which is the safe
          # direction. Nothing here can rewrite history on master.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:refs/heads/${MAIN_BRANCH}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Pushed the import straight to ${MAIN_BRANCH}."
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          # Not fatal, and the usual cause is branch protection rather than a broken push. The
          # dev side still runs, and the summary says master was not updated - which is what
          # somebody needs to read, rather than a red X with no explanation.
          echo "::warning::Could not push ${MAIN_BRANCH} (branch protection, or it moved during the run). ${DEV_BRANCH} is unaffected; the next run will merge again from the new tip."
          echo "blocked=true" >> "$GITHUB_OUTPUT"
          exit 0

      # dev merges from the local ${{ env.MAIN_BRANCH }} branch this run just built, so the
      # remote ref is refreshed only to keep the checkout honest for anything reading it later.
      - name: Refresh ${{ env.MAIN_BRANCH }} after the push
        if: steps.push_main.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${MAIN_BRANCH}:refs/remotes/origin/${MAIN_BRANCH}"

      # dev is only offered a merge from a master import that is itself clean, so a
      # conflicted master never leaks a partially merged tree into the development branch.
      # It runs even when upstream brought nothing new, because dev can still be behind a
      # master import that was merged on an earlier run while the dev pull request was not.
      - name: Merge the import into the ${{ env.DEV_BRANCH }} sync branch
        id: merge_dev
        if: steps.merge_main.outputs.conflict == 'false'
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if ! git ls-remote --exit-code --heads origin "${DEV_BRANCH}" >/dev/null 2>&1; then
            # Previously this branch was created from master by the sync itself. A pull
            # request needs a base branch that already exists, and creating a long-lived
            # branch is not something an unattended job should do, so it is left to a human.
            echo "::warning::Branch ${DEV_BRANCH} does not exist; create it from ${MAIN_BRANCH} once and the sync will keep proposing merges into it."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "${DEV_SYNC_BRANCH}" "origin/${DEV_BRANCH}"
          before="$(git rev-parse HEAD)"
          behind="$(git rev-list --count "HEAD..${MAIN_BRANCH}")"
          echo "new_commits=${behind}" >> "$GITHUB_OUTPUT"

          if [ "${behind}" = "0" ]; then
            {
              echo "conflict=false"
              echo "changed=false"
            } >> "$GITHUB_OUTPUT"
            echo "${DEV_BRANCH} already contains this import."
            exit 0
          fi

          # --no-ff for the same reason as on master: a bot-authored tip is what the
          # force-push guard uses to recognise its own branch.
          if git merge --no-ff --no-edit \
              -m "Merge ${MAIN_BRANCH} into ${DEV_BRANCH}" "${MAIN_BRANCH}"; then
            {
              echo "conflict=false"
              echo "changed=true"
            } >> "$GITHUB_OUTPUT"

            files="$(git diff --name-only "${before}" HEAD)"
            file_count="$(printf '%s\n' "${files}" | grep -c . || true)"
            # ALLOW-LIST, not a deny-list. The deny-list this replaces listed the build files
            # someone thought of - *.gradle, *.properties, the wrapper, .github/workflows - and
            # silently auto-merged everything else. It missed OsmAnd/old-ndk-build.sh, which
            # build-common.gradle executes via `bash`, and OsmAnd/jni/*.mk, which are fed to
            # ndk-build (GNU make, which runs $(shell ...)). An upstream edit to any of those
            # would have merged itself onto a branch whose next build runs with this fork's
            # Places key, and the pull request would have said "no build scripts in this import".
            #
            # Inverting it fixes the whole class rather than the three instances: content types
            # that cannot execute are named explicitly, and ANYTHING else - a file extension
            # nobody has thought of yet - waits for a human. That is the failure direction to
            # choose when the cost of being wrong is a signing key.
            executable="$(printf '%s\n' "${files}" \
              | grep -vE '\.(java|kt|xml|json|txt|md|png|webp|jpe?g|gif|svg|ttf|otf)$' || true)"
            # Same rule as on master; see the comment there.
            if [ -n "${executable}" ]; then
              echo "automerge=false" >> "$GITHUB_OUTPUT"
            else
              echo "automerge=true" >> "$GITHUB_OUTPUT"
            fi
            # Exported because the review notification names these files, and that list is
            # the whole reason a human is being asked: a pull request would have buried it
            # under several hundred translation diffs. Random delimiter for the same reason
            # as the conflict list below - a filename cannot be trusted not to contain EOF.
            {
              delimiter="EOF_$(openssl rand -hex 16)"
              echo "executable<<${delimiter}"
              printf '%s\n' "${executable}"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
            {
              echo "Merges the \`${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}\` import (\`${UPSTREAM_SHA}\`) into \`${DEV_BRANCH}\`."
              echo
              echo "- **${behind}** commits not yet on \`${DEV_BRANCH}\`, **${file_count}** files changed"
              echo "- Merged cleanly against the fork's own commits - no conflicts"
              echo "- \`${MAIN_BRANCH}\` already has this import - it is pushed directly, with no pull request"
              echo "- Opened by [this workflow run](${RUN_URL})"
              echo
              echo "Merging this is what puts upstream code in front of the dev build, so"
              echo "review it on its own terms even if the \`${MAIN_BRANCH}\` pull request"
              echo "has already been merged."
              echo
              if [ -n "${executable}" ]; then
                echo "### :warning: This import changes files that CI executes"
                echo
                echo "Read these first - Gradle runs arbitrary code from any build script it"
                echo "loads, and merging this PR is what puts that code on a runner."
                echo
                echo '```'
                printf '%s\n' "${executable}"
                echo '```'
              else
                echo "### Nothing executable in this import"
                echo
                echo "Every changed file is source, markup or an image - nothing CI can run."
                echo "Merged automatically."
              fi
              echo
              echo "### Commits"
              echo
              git log --no-merges --max-count=50 --format='- `%h` %s' "${before}..HEAD"
              if [ "${behind}" -gt 50 ]; then
                echo "- ... and $(( behind - 50 )) more"
              fi
            } > "${RUNNER_TEMP}/pr-body-dev.md"
          else
            {
              echo "conflict=true"
              echo "changed=false"
              # Random delimiter, for the same reason as on the master merge above.
              delimiter="EOF_$(openssl rand -hex 16)"
              echo "conflicts<<${delimiter}"
              git diff --name-only --diff-filter=U
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "::warning::Conflicts merging ${MAIN_BRANCH} into ${DEV_BRANCH}; no pull request opened."
          fi
          exit 0

      # The dev side, and why it no longer opens a pull request.
      #
      # SIX consecutive scheduled runs failed, every one at `gh pr create`, so the daily sync
      # had not worked once and upstream reached this fork only when the owner merged it by
      # hand in the web UI. The cause is a repository setting no workflow can see from the
      # inside - "Allow GitHub Actions to create and approve pull requests" - which no amount
      # of `permissions:` in this file overrides.
      #
      # The review gate is NOT what is being removed; the ceremony around the case that never
      # needed reviewing is:
      #
      #   cannot execute (java/kt/xml/png/...) -> merged and pushed to dev DIRECTLY. No sync
      #                                           branch, no pull request, nothing to click.
      #   can execute (anything else)          -> parked on sync/upstream-dev and reported on
      #                                           a tracking ISSUE naming the files. Issue
      #                                           creation is not subject to that setting.
      #
      # Gradle runs arbitrary code out of every *.gradle file it loads and dev is the branch
      # that builds with this fork's keys, so the second case still waits for a human. It is
      # the small minority of imports.
      - name: Merge upstream into ${{ env.DEV_BRANCH }}
        id: push_dev
        if: steps.merge_dev.outputs.changed == 'true'
        env:
          AUTOMERGE: ${{ steps.merge_dev.outputs.automerge }}
        run: |
          set -uo pipefail
          if [ "${AUTOMERGE}" = "true" ]; then
            # HEAD is the merge commit built on origin/dev by the previous step, so this is a
            # fast-forward of dev onto the tree that was just classified - not a second merge.
            for attempt in 1 2 3 4; do
              if git push origin "HEAD:refs/heads/${DEV_BRANCH}"; then
                echo "pushed_dev=true" >> "$GITHUB_OUTPUT"
                echo "Pushed straight to ${DEV_BRANCH}: the import touches nothing CI executes."
                exit 0
              fi
              sleep $((2 ** attempt))
            done
            # Almost always means dev moved while this ran. Re-merging on top would produce a
            # DIFFERENT merge from the one classified above, and pushing that unreviewed is
            # exactly what the classification exists to prevent - so stop and let tomorrow's
            # run start from the new tip. A warning, not a failure: nothing is broken.
            echo "::warning::Could not fast-forward ${DEV_BRANCH} - it most likely moved during this run. Nothing pushed; the next run re-merges from the new tip."
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Needs a human. Park it, and never force-push over a branch whose tip is somebody's
          # conflict resolution rather than this bot's own commit.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${DEV_SYNC_BRANCH}:refs/remotes/origin/${DEV_SYNC_BRANCH}" 2>/dev/null || true
          if git rev-parse --verify -q "origin/${DEV_SYNC_BRANCH}" >/dev/null; then
            tip_author="$(git log -1 --format='%ae' "origin/${DEV_SYNC_BRANCH}")"
            if [ "${tip_author}" != "${BOT_EMAIL}" ]; then
              echo "::warning::${DEV_SYNC_BRANCH} ends in a commit by ${tip_author}, not this bot. Leaving it alone - merge it into ${DEV_BRANCH} first."
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          for attempt in 1 2 3 4; do
            if git push --force origin "HEAD:refs/heads/${DEV_SYNC_BRANCH}"; then
              echo "pushed_branch=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push ${DEV_SYNC_BRANCH}"
          exit 1

      # Only for the review case. An ISSUE rather than a pull request: issue creation is not
      # gated by the setting that made every previous run fail, and what a reviewer actually
      # needs here is the list of executable files, which a pull request buries under several
      # hundred translation diffs.
      - name: Report an import that needs review
        id: review_dev
        if: steps.push_dev.outputs.pushed_branch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COMMITS: ${{ steps.merge_dev.outputs.new_commits }}
          EXECUTABLE: ${{ steps.merge_dev.outputs.executable }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "An upstream import is parked on \`${DEV_SYNC_BRANCH}\` because it changes files"
            echo "that CI executes. Everything else now syncs to \`${DEV_BRANCH}\` automatically,"
            echo "with no branch and no pull request."
            echo
            echo "- **${NEW_COMMITS}** commits from \`${UPSTREAM_REPOSITORY}#${UPSTREAM_BRANCH}\` at \`${UPSTREAM_SHA}\`"
            echo "- Run: ${RUN_URL}"
            echo
            echo "**Files that can execute during a build - these are what to read:**"
            echo '```'
            echo "${EXECUTABLE}"
            echo '```'
            echo
            echo "Gradle runs arbitrary code out of every \`*.gradle\` file it loads, and"
            echo "\`${DEV_BRANCH}\` is the branch that builds with this fork's Places key."
            echo "Merging is what puts that code on a runner."
            echo
            echo "To accept it:"
            echo '```'
            echo "git fetch origin"
            echo "git checkout ${DEV_BRANCH} && git merge --ff-only origin/${DEV_SYNC_BRANCH}"
            echo "git push origin ${DEV_BRANCH}"
            echo '```'
          } > "${RUNNER_TEMP}/review-body.md"

          gh label create upstream-sync-review \
            --description "Upstream import changes files CI executes - needs a human" \
            --color FBCA04 2>/dev/null || true
          existing="$(gh issue list --label upstream-sync-review --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/review-body.md"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            gh issue create \
              --title "Upstream import needs review (${NEW_COMMITS} commits)" \
              --label upstream-sync-review \
              --body-file "${RUNNER_TEMP}/review-body.md"
            echo "number=$(gh issue list --label upstream-sync-review --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"
          fi

      - name: Report conflicts
        if: steps.merge_main.outputs.conflict == 'true' || steps.merge_dev.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_CONFLICT: ${{ steps.merge_main.outputs.conflict }}
          MAIN_CONFLICTS: ${{ steps.merge_main.outputs.conflicts }}
          DEV_CONFLICTS: ${{ steps.merge_dev.outputs.conflicts }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The automatic upstream sync stopped because a merge conflicted."
            echo
            if [ "${MAIN_CONFLICT}" = "true" ]; then
              echo "\`${MAIN_BRANCH}\` is a mirror whose only fork content is the sync workflow itself,"
              echo "so a conflict here means upstream changed that file or something genuinely odd"
              echo "happened. Read it rather than resolving it on autopilot."
              echo
              echo "Nothing was pushed - \`${MAIN_BRANCH}\` and \`${DEV_BRANCH}\` are untouched."
            else
              echo "The \`${MAIN_BRANCH}\` mirror updated cleanly and was pushed directly, as it always is."
              echo "Only the \`${DEV_BRANCH}\` side conflicted; no pull request was opened for it."
            fi
            echo
            echo "- Upstream: \`${UPSTREAM_REPOSITORY}#${UPSTREAM_BRANCH}\` at \`${UPSTREAM_SHA}\`"
            echo "- Run: ${RUN_URL}"
            echo
            if [ -n "${MAIN_CONFLICTS}" ]; then
              echo "**Conflicts merging upstream into \`${MAIN_BRANCH}\`:**"
              echo '```'
              echo "${MAIN_CONFLICTS}"
              echo '```'
              echo
            fi
            if [ -n "${DEV_CONFLICTS}" ]; then
              echo "**Conflicts merging \`${MAIN_BRANCH}\` into \`${DEV_BRANCH}\`:**"
              echo '```'
              echo "${DEV_CONFLICTS}"
              echo '```'
              echo
            fi
            echo "Resolve it locally and push. The sync will not force-push over a branch"
            echo "whose last commit is not the bot's, so a resolution parked on the sync"
            echo "branch is safe there until you merge it."
            echo '```'
            echo "git fetch origin"
            if [ "${MAIN_CONFLICT}" = "true" ]; then
              echo "git remote add upstream https://github.com/${UPSTREAM_REPOSITORY}.git"
              echo "git fetch upstream ${UPSTREAM_BRANCH}"
              echo "git checkout -B ${MAIN_BRANCH} origin/${MAIN_BRANCH}"
              echo "git merge --no-ff upstream/${UPSTREAM_BRANCH}"
              echo "# resolve, commit, then:"
              echo "git push origin ${MAIN_BRANCH}"
            else
              echo "git checkout -B ${DEV_SYNC_BRANCH} origin/${DEV_BRANCH}"
              echo "git merge --no-ff origin/${MAIN_BRANCH}"
              echo "# resolve, commit, then:"
              echo "git checkout ${DEV_BRANCH} && git merge --ff-only ${DEV_SYNC_BRANCH}"
              echo "git push origin ${DEV_BRANCH}"
            fi
            echo '```'
          } > "${RUNNER_TEMP}/conflict-body.md"

          existing="$(gh issue list --label upstream-sync-conflict --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/conflict-body.md"
          else
            gh label create upstream-sync-conflict \
              --description "Automatic upstream sync needs manual conflict resolution" \
              --color B60205 2>/dev/null || true
            gh issue create \
              --title "Upstream sync blocked by merge conflicts" \
              --label upstream-sync-conflict \
              --body-file "${RUNNER_TEMP}/conflict-body.md"
          fi
          exit 1

      # No build is dispatched from here, deliberately, and that matters MORE now that the
      # safe case pushes dev directly. An import classified as non-executable lands on dev
      # without a human, but it still does not start anything: the next build is one somebody
      # asks for. The build workflow is where the Places key lives and, for tags, the release
      # keystore, and nothing in this file may reach either on its own.

      - name: Summary
        if: always()
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          MAIN_CONFLICT: ${{ steps.merge_main.outputs.conflict }}
          MAIN_CHANGED: ${{ steps.merge_main.outputs.changed }}
          MAIN_BLOCKED: ${{ steps.push_main.outputs.blocked }}
          MAIN_PUSHED: ${{ steps.push_main.outputs.pushed }}
          DEV_CONFLICT: ${{ steps.merge_dev.outputs.conflict }}
          DEV_CHANGED: ${{ steps.merge_dev.outputs.changed }}
          DEV_BLOCKED: ${{ steps.push_dev.outputs.blocked }}
          DEV_PUSHED: ${{ steps.push_dev.outputs.pushed_dev }}
          DEV_MOVED: ${{ steps.push_dev.outputs.moved }}
          DEV_REVIEW: ${{ steps.review_dev.outputs.number }}
          DEV_MISSING: ${{ steps.merge_dev.outputs.missing }}
          NEW_COMMITS: ${{ steps.merge_main.outputs.new_commits }}
        run: |
          set -uo pipefail
          describe() {
            # $1 conflict, $2 changed, $3 blocked, $4 pushed to dev, $5 review issue, $6 moved
            if [ "${1:-}" = "true" ]; then
              echo "conflicted - reported on the tracking issue, nothing pushed"
            elif [ "${3:-}" = "true" ]; then
              echo "not refreshed - the sync branch carries a manual commit"
            elif [ "${4:-}" = "true" ]; then
              echo "pushed directly - no branch, no pull request"
            elif [ -n "${5:-}" ]; then
              echo "parked on \`${DEV_SYNC_BRANCH}\` (changes files CI executes) - see issue #${5}"
            elif [ "${6:-}" = "true" ]; then
              echo "not pushed - ${DEV_BRANCH} moved mid-run; the next run re-merges"
            elif [ "${2:-}" = "false" ]; then
              echo "already up to date"
            else
              echo "not attempted"
            fi
          }
          {
            echo "## Upstream sync"
            echo
            echo "Imports that touch no build script merge themselves. Imports that change a"
            echo "\`*.gradle\` file, the Gradle wrapper or a workflow stay open for review, because"
            echo "merging those is what puts upstream code on a runner holding this fork's keys."
            echo "No build is dispatched from here either way."
            echo
            echo "| Target | Result |"
            echo "| --- | --- |"
            echo "| Upstream | \`${UPSTREAM_REPOSITORY}#${UPSTREAM_BRANCH}\` @ \`${UPSTREAM_SHA:-unknown}\` (${NEW_COMMITS:-0} new commits) |"
            if [ "${MAIN_CONFLICT:-}" = "true" ]; then
              main_result="conflicted - reported on the tracking issue, nothing pushed"
            elif [ "${MAIN_BLOCKED:-}" = "true" ]; then
              main_result="NOT UPDATED - the push was refused (branch protection, or master moved mid-run)"
            elif [ "${MAIN_PUSHED:-}" = "true" ]; then
              main_result="pushed directly - no branch, no pull request"
            elif [ "${MAIN_CHANGED:-}" = "false" ]; then
              main_result="already up to date"
            else
              main_result="not attempted"
            fi
            echo "| \`${MAIN_BRANCH}\` | ${main_result} |"
            if [ "${DEV_MISSING:-}" = "true" ]; then
              echo "| \`${DEV_BRANCH}\` | branch does not exist - create it from \`${MAIN_BRANCH}\` |"
            else
              echo "| \`${DEV_BRANCH}\` | $(describe "${DEV_CONFLICT}" "${DEV_CHANGED}" "${DEV_BLOCKED}" "${DEV_PUSHED}" "${DEV_REVIEW}" "${DEV_MOVED}") |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
