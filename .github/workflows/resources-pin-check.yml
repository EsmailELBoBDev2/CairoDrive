name: Check the pinned OsmAnd-resources

# The build checks out osmandapp/OsmAnd-resources at a PINNED commit, because that checkout is
# not incidental: routing.xml comes from it and is then patched with this fork's narrow-street
# rules, as do rendering_types, poi_types and the routing test maps. Unpinned, an upstream push
# could change the routing profile inside a SHIPPED APK with no commit in this repository, and
# make two builds of the same commit differ.
#
# Pinning has one failure mode, and it is silent: the pin rots. Months pass, upstream fixes
# something in routing.xml, and nobody notices because a pin never complains. This is the thing
# that complains.
#
# It BUMPS THE PIN ITSELF - but it TRIES THE NEW RESOURCES FIRST, and only commits if they pass.
#
# The obvious design is push-then-watch: commit the bump, let the dev build catch a breakage,
# revert if it goes red. That works and it is wrong here, for a reason worth writing down: it
# leaves `dev` broken for the twenty minutes the build takes, and when it does revert you are
# back on the old resources with nothing learned, waiting for a human anyway. The automation
# would be hands-off only while nothing went wrong, which is exactly when nobody needs it.
#
# So the check is moved BEFORE the commit. A resources bump can break precisely two things, and
# both are testable here in a couple of minutes without the Android toolchain:
#
#   1. the fork's patches/ scripts, which edit routing.xml, the asset manifest and the render
#      style - they abort loudly by design if upstream restructures what they edit;
#   2. the Java test suite, whose ROUTING TEST MAPS come from this same resources repository -
#      so the tests genuinely exercise the data that just changed.
#
# Neither needs the NDK, R8, or a 17-minute Android build. If both pass, the bump is committed
# and the normal dev build runs as usual. If either fails, NOTHING is committed - dev never goes
# red, the pin stays on the last known-good, and an issue carries the actual failure text.
#
# Every bump is still a COMMIT, which is the part that matters. Reproducibility never came from a
# person typing the number; it came from the number being in history, bisectable and revertable.
# `latest` has neither property.
#
# Shipping still needs a `v*` tag and the `production` reviewer, which nothing here can satisfy.

on:
  schedule:
    # Daily. When this filed an issue, weekly was right because each one was a chore; now that
    # it bumps by itself the only cost of checking is a few seconds of runner time, and being
    # a day behind beats being a week behind.
    #
    # On the DEFAULT branch or it never fires: GitHub reads `schedule:` only from the default
    # branch's copy of a workflow, and a cron on a feature branch is silently inert with no
    # error anywhere. upstream-sync.yml carries the same warning, learned the same way.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  # Push the pin bump to dev.
  contents: write
  # Fall back to a pull request if dev turns out to be branch-protected.
  pull-requests: write

concurrency:
  group: resources-pin-check
  cancel-in-progress: false

jobs:
  check:
    name: Compare the pin against upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          # Needed: this job pushes the bump.
          persist-credentials: true

      - name: Read the pin and compare
        id: compare
        run: |
          set -euo pipefail

          # Associate each pin with ITS checkout by walking forward from the repository line to
          # the next `ref:` in the same step, stopping at the next step boundary.
          #
          # The obvious version - grep for the ref with a few lines of leading context - was
          # written first and silently found NOTHING, because there is a long comment between
          # `repository:` and `ref:` and the context window did not reach. A checker that
          # reports "no pin" when a pin is right there is worse than no checker: it would have
          # failed this workflow every week for a reason that was not true. Caught by running
          # it against the real file before shipping, which is the only reason it is not still
          # in here.
          #
          # There are two pins, one per job, and they MUST agree: a bump applied to the dev job
          # but not the release job means the signed build that reaches Play uses different
          # routing data from the one that was tested.
          mapfile -t RESOURCE_PINS < <(awk '
            /repository: *osmandapp\/OsmAnd-resources/ { inblock = 1; next }
            inblock && /^ *- name:/                    { inblock = 0 }
            inblock && match($0, /ref: *[0-9a-f]{40}/) {
              s = substr($0, RSTART, RLENGTH); sub(/ref: */, "", s); print s; inblock = 0
            }
          ' .github/workflows/build-dev.yml | sort -u)

          if [ "${#RESOURCE_PINS[@]}" -eq 0 ]; then
            echo "::error::No pinned OsmAnd-resources ref found in build-dev.yml. Either the pin was removed - which silently makes the build unreproducible again - or the checkout was restructured and this check needs updating."
            exit 1
          fi
          if [ "${#RESOURCE_PINS[@]}" -gt 1 ]; then
            echo "::error::The OsmAnd-resources pins disagree: ${RESOURCE_PINS[*]}. The two jobs would build against different routing data."
            exit 1
          fi

          PINNED="${RESOURCE_PINS[0]}"
          UPSTREAM="$(git ls-remote https://github.com/osmandapp/OsmAnd-resources HEAD | awk '{print $1}')"
          echo "pinned=${PINNED}"   >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          if [ "${PINNED}" = "${UPSTREAM}" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Pin is current: ${PINNED}"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::notice::OsmAnd-resources has moved. Pinned ${PINNED}, upstream ${UPSTREAM}."
          fi

      # ---- everything below only runs when upstream actually moved ----

      - name: Check out the CANDIDATE resources
        if: steps.compare.outputs.drift == 'true'
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          ref: ${{ steps.compare.outputs.upstream }}
          path: resources
          persist-credentials: false

      - name: Set up JDK 17
        if: steps.compare.outputs.drift == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Do the fork's patches still apply?
        id: patches
        if: steps.compare.outputs.drift == 'true'
        run: |
          set -euo pipefail
          # The same three scripts the real build runs, in the same order, against the CANDIDATE
          # resources. They abort by design when upstream restructures what they edit - which is
          # the single most likely way a resources bump breaks this fork, and it is caught here
          # in seconds instead of eleven minutes into an Android build.
          python3 patches/cairodrive_narrow_streets.py resources/routing/routing.xml
          python3 patches/cairodrive_trim_assets.py resources
          python3 patches/cairodrive_driving_style.py resources/rendering_styles/default.render.xml
          echo "Patches applied cleanly to the candidate resources."

      - name: Do the Java tests still pass on the new data?
        id: tests
        if: steps.compare.outputs.drift == 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          # The routing TEST MAPS live in the resources repository, so this suite genuinely
          # exercises the data that just changed - it is not a proxy. No NDK, no R8, no Android
          # packaging: minutes, not the seventeen a full build costs.
          ./gradlew --no-daemon --stacktrace :OsmAnd-java:test :OsmAnd-java:routingTest

      - name: Report what broke, and change nothing
        if: failure() && steps.compare.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
        run: |
          set -euo pipefail
          MARKER="resources-pin-blocked"
          EXISTING="$(gh issue list --state open --search "\"${MARKER}\" in:body" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Issue #${EXISTING} already open for this; not filing another."
            exit 0
          fi
          BODY=blocked.md
          {
            echo 'The daily resources bump was attempted and **rejected before anything was'
            echo 'committed**. Nothing changed: the pin is still on the last known-good commit,'
            echo '`dev` is untouched, and the build is green.'
            echo
            echo "| | commit |"
            echo "|---|---|"
            echo "| still pinned (known good) | \`${PINNED}\` |"
            echo "| rejected candidate | \`${UPSTREAM}\` |"
            echo
            echo "Compare: https://github.com/osmandapp/OsmAnd-resources/compare/${PINNED}...${UPSTREAM}"
            echo
            echo 'Either the fork'"'"'s `patches/` scripts no longer apply - they abort on purpose'
            echo 'when upstream restructures what they edit - or the Java tests failed against the'
            echo 'new routing data. The run log for this workflow has the exact failure.'
            echo
            echo 'This will retry every night and keep failing until the patch scripts are updated'
            echo 'or the upstream change is understood. That is deliberate: a silent retry loop'
            echo 'that never lands is how a pin rots while looking healthy.'
            echo
            echo "<!-- ${MARKER} -->"
          } > "${BODY}"
          gh issue create \
            --title "Resources bump blocked: patches or tests fail on ${UPSTREAM:0:12}" \
            --body-file "${BODY}"

      - name: Bump the pin and push
        # Only after the candidate proved itself above. `success()` is explicit rather than
        # implied: without it a failed verification would still reach this step on a later edit.
        if: success() && steps.compare.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
        run: |
          set -euo pipefail
          git config user.name  "cairodrive-bot"
          git config user.email "noreply@github.com"

          # Both pins, in one commit. Bumping one and not the other is the failure the compare
          # step above refuses to let stand, so it must not be introduced here either.
          sed -i "s/${PINNED}/${UPSTREAM}/g" .github/workflows/build-dev.yml
          COUNT="$(grep -c "ref: ${UPSTREAM}" .github/workflows/build-dev.yml || true)"
          if [ "${COUNT}" -ne 2 ]; then
            echo "::error::Expected 2 pins after the bump, found ${COUNT}. Refusing to push a half-applied change."
            exit 1
          fi

          {
            echo "Bump OsmAnd-resources to ${UPSTREAM:0:12}"
            echo
            echo "Automatic. Upstream resources moved; this is the commit that records it, so the"
            echo "change is bisectable and revertable instead of arriving invisibly at build time."
            echo
            echo "  was ${PINNED}"
            echo "  now ${UPSTREAM}"
            echo
            echo "https://github.com/osmandapp/OsmAnd-resources/compare/${PINNED}...${UPSTREAM}"
            echo
            echo "routing.xml, rendering_types, poi_types and the routing TEST MAPS all come from"
            echo "this repository, so this can move the test suite as well as the app. The dev"
            echo "build this push triggers is the check: it is debug-signed and cannot reach Play,"
            echo "and shipping still needs a v* tag plus the production reviewer."
            echo
            echo "To undo: git revert this commit."
          } > msg.txt

          git add .github/workflows/build-dev.yml
          git commit -F msg.txt
          rm -f msg.txt

          # Straight to dev when allowed - that push runs the full build and the tests. If dev is
          # branch-protected the push is REJECTED rather than silently skipped, so fall back to a
          # pull request instead of losing the bump.
          if git push origin HEAD:dev; then
            echo "Pushed the bump to dev; its build is the verification."
          else
            echo "::warning::Direct push to dev was rejected (branch protection). Opening a pull request instead."
            BRANCH="auto/resources-pin-${UPSTREAM:0:12}"
            git push -f origin "HEAD:${BRANCH}"
            gh pr create --base dev --head "${BRANCH}" \
              --title "Bump OsmAnd-resources to ${UPSTREAM:0:12}" \
              --body "Automatic pin bump. See the commit message for the compare link and what it can affect." \
              || echo "A pull request for this branch already exists."
          fi
