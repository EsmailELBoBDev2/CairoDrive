name: Build CairoDrive

# Produces the shippable artifacts for the CairoDrive flavor (applicationId
# com.cairodrive.app, see OsmAnd/cairodrive.gradle) built against the prebuilt OpenGL core
# AAR for rendering - though the native C++ routing library is still built with the NDK, which
# is most of the wall time. It builds arm64-v8a only by default; see the abi input for why, and
# for when to switch back to fat.
#
# Two jobs, and the split is the whole point of this file (2026-07 supply-chain review):
#
#   build    every push to dev, and manual runs. No signing credentials on the runner at
#            all. Release artifacts fall back to the checked-in debug keystore, which
#            OsmAnd/cairodrive.gradle handles on its own, so a dev push still yields an
#            installable APK with no approval, no waiting and no key exposure.
#
#   release  tags matching v*, or a manual run with sign=true. Runs in the `production`
#            GitHub Environment, which holds the keystore secrets and requires a reviewer
#            to approve the run before its first step executes.
#
# Where the boundary sits, and why it is not drawn around the Places key too:
#
#   Gradle executes arbitrary code from every build script it loads, so any job that runs
#   ./gradlew hands the whole environment to whatever is in the tree. The two secrets are
#   not equally bad to lose there. The signing keystore is not rotatable: it is the app's
#   identity on Google Play, a leak lets anyone ship a signed "CairoDrive", and losing it
#   ends updates to the listing. The Places key ships inside every APK already - anyone
#   with a copy of the app can pull it out - it is restricted by package name and signing
#   certificate, and it can be rotated in a browser in two minutes. So the keystore gets
#   the human gate and the Places key does not; putting an approval prompt in front of
#   every dev build would only teach the owner to click through it.
#
# The upstream sync no longer pushes to dev or dispatches this workflow, so what builds
# here is what a human merged. See .github/CICD.md.

on:
  push:
    # Kept deliberately, after being removed and restored the same day. Its artifacts are
    # debug-signed and Play rejects them, so the ONLY thing this produces is a compile check -
    # but that is worth the runner time. A missing import once surfaced inside a signed build
    # instead, after the approval and the keystore decode, and cost 15 minutes to find out
    # something a free run would have said for nothing.
    branches: [dev]
    # A tag is the release trigger: `git tag -a v4.9.10-cd1 && git push origin --tags`.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      abi:
        # Corrected from "anything narrower than fat cannot be rolled out on Google Play",
        # which overstated it. Play accepts an arm64-only bundle perfectly well - what it
        # refuses is a release that strands EXISTING installs: if someone already has the app
        # on an ABI the new bundle omits, the upload is rejected with "doesn't allow any
        # existing users to upgrade". With a single internal tester on an arm64 phone there is
        # nothing to strand, which is why arm64 is the default here.
        #
        # It is also the biggest remaining lever on build time. jni/Application.mk keys off
        # ARM64_ONLY, so this compiles the C++ routing core for one ABI instead of four - the
        # native phase, which is most of the build, drops to about a quarter.
        #
        # Switch back to fat before any wider rollout, or if Play ever reports the upgrade
        # error above.
        description: 'ABI flavor. arm64 builds ~4x faster; use fat for a wide rollout.'
        type: choice
        required: false
        default: 'arm64'
        options: [arm64, armonly, fat, armv7, x86]
      core:
        description: 'Core flavor. legacy compiles the native core with the NDK and is much slower.'
        type: choice
        required: false
        default: 'opengl'
        options: [opengl, legacy]
      version_code:
        description: 'Override versionCode (leave empty to use the value in build.gradle)'
        required: false
        default: ''
      sign:
        description: 'Sign with the release keystore. Runs in the production environment and waits for a reviewer.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Signed runs get their own group, and are never cancelled.
  #
  # Every run on a ref used to share one group with cancel-in-progress, so a push cancelled
  # whatever was already building. That is right for dev builds - a compile check of code that
  # has just been superseded is waste - and wrong for a signed release: it had already passed
  # the reviewer gate, decoded the keystore and spent eighteen minutes, and it was killed by an
  # unrelated push to the same branch. The artifact someone is waiting on is not disposable.
  #
  # `github.run_id` is unique per run, so signed builds never cancel each other either; two
  # concurrent releases is not a situation worth optimising away.
  group: >-
    ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign)
        && format('build-release-{0}', github.run_id)
        || format('build-dev-{0}', github.ref) }}
  cancel-in-progress: true

env:
  # `inputs.abi` is empty on a push, so this fallback is what every push build uses. Kept in
  # step with the dispatch default above - see the note there for why arm64 rather than fat,
  # and for the one condition that would send it back to fat.
  ABI: ${{ inputs.abi || 'arm64' }}
  CORE: ${{ inputs.core || 'opengl' }}

jobs:
  # ---------------------------------------------------------------------------------
  # Ordinary development build. Nothing here can reach the signing keys: they live in the
  # `production` environment, and `secrets.*` in a job without an `environment:` resolves
  # to empty for them.
  # ---------------------------------------------------------------------------------
  build:
    name: Dev build - unsigned
    # Tags go down the release path instead, and an explicit sign=true request should not
    # also spend 20 minutes on an unsigned copy of the same thing. `inputs` is null on a
    # push event, and null is false here.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.sign }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The `secrets` context is not available in a step-level `if:` - only in a step's
      # `env:`/`with:`/`run:` and in a job-level `env:` like this one. Testing the secret
      # directly in the `if:` below would make the whole workflow file fail to parse with
      # "Unrecognized named-value: 'secrets'", so the presence check is hoisted here.
      HAS_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}

    steps:
      # OsmAnd's build scripts reach out of the module with ../../resources, so the
      # sibling repositories have to sit next to the checkout, not inside it.
      - name: Checkout CairoDrive
        uses: actions/checkout@v7
        with:
          path: android
          # Otherwise the job's GITHUB_TOKEN is left in android/.git/config for the whole
          # build, where every Gradle plugin and every upstream build script can read it.
          # Nothing here pushes; the git commands are a `rev-parse` and a read-only `diff`.
          persist-credentials: false
          # The default depth of 1 has no parent commit, so the static-check step could not
          # work out what this push changed and would fall back to checking nothing. 20 covers
          # any realistic push without paying for a full clone of a repo this size; the step
          # degrades to HEAD~1 on its own if `before` is older than that.
          fetch-depth: 20

      - name: Checkout OsmAnd-resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          # PINNED, like OsmAnd-core-legacy below it.
          #
          # Unpinned, this took upstream's default branch live on every build - and this checkout
          # is not incidental: routing.xml comes from it (Gradle Syncs it into OsmAnd-java, then
          # the patch step below adds the fork's narrow-street rules), as do rendering_types,
          # poi_types and the routing test maps. So an upstream push could change the routing
          # profile INSIDE A SHIPPED APK with no commit in this repository, and change it between
          # two builds of the same commit.
          #
          # For the record: this was my first suspect for the routing test that started failing
          # after the merge, and it was NOT the cause - that repo's last commit was hours before
          # both the green and the red builds. Pinning is worth doing on its own merits, not as a
          # fix for that.
          #
          # To take a newer upstream: bump this SHA in its own commit, so the change is reviewable
          # and bisectable like any other.
          ref: d87f3d4f6270974e7222b7fbddcc9e4c911ade85
          path: resources
          persist-credentials: false

      # Adds the car profile's "deprioritise narrow streets" option. routing.xml is not in
      # this repo - Gradle Syncs it from the checkout above, and Sync deletes the
      # destination, so a vendored copy would be wiped every build. Patching the checkout
      # here is the only place the change survives. The script exits non-zero if upstream
      # has restructured, so this fails the build rather than silently shipping without it.
      - name: Apply CairoDrive routing profile patches
        run: |
          set -euo pipefail
          python3 android/patches/cairodrive_narrow_streets.py resources/routing/routing.xml
          # Drops proj.db and the CJK / South Asian / South-East Asian / Tibetan fonts - 17 MB
          # of assets no Egyptian map uses - AND the matching bundled_assets.json entries, in
          # one atomic step. It has to be one step: CheckAssetsTask.unpackBundledAssets has no
          # per-entry catch, so an asset listed in the manifest but absent from the APK aborts
          # the whole unpack and the app silently comes up with no fonts, no voice prompts and
          # no basemap. The script refuses to half-apply, and asserts the Arabic Nastaliq font
          # survives - it is the only font in the manifest covering Arabic script, so losing it
          # would turn every Cairo street label into empty boxes.
          python3 android/patches/cairodrive_trim_assets.py resources
          # B3. Injects the glance style, gated on a rendering property - so this runs
          # unconditionally and does nothing until `cairodriveDriving` is on. That property now
          # DEFAULTS on, and can still be flipped in Configure map mid-drive without a rebuild.
          # Applying it always keeps the two CI jobs producing identical styles.
          python3 android/patches/cairodrive_driving_style.py resources/rendering_styles/default.render.xml
          # B3, icons. Desaturates the POI icons the glance style still draws, keeping shape and
          # alpha and dropping only hue, so they stop competing with the route line and the arrow.
          #
          # READ THIS BEFORE ASSUMING IT BEHAVES LIKE THE LINE ABOVE. That one edits XML behind a
          # runtime switch; this one edits BITMAPS. Turning the glance style off in Configure map
          # does NOT bring the colour back - only a build without this step does. It is
          # unconditional for the same reason the style patch is: two jobs, identical output.
          #
          # Fuel, charging, hazard, traffic, speed, railway, barrier, emergency, hospital,
          # pharmacy, police and toll keep their colour - those are the ones where colour IS the
          # information a driver acts on.
          #
          # The script REFUSES to match zero icons rather than reporting success and changing
          # nothing, so an upstream rename fails the build here instead of shipping a silently
          # unchanged icon set. The listing below turns that failure into a one-cycle diagnosis
          # rather than a guess at what upstream renamed.
          # NON-BLOCKING, and that is a deliberate correction. The first wiring of this used
          # `exit 1`, matching the three scripts above. Those three earn it: a missing routing
          # profile, a half-trimmed asset manifest or an unpatched style all produce an app that
          # is wrong in ways a drive cannot reveal. Icon HUE does not - the worst case is icons
          # that stay colourful, which is simply the previous build.
          #
          # It cost three commits of zero compile signal to learn that, because this step gates
          # every later step including the compile. A cosmetic patch must never be able to do
          # that again. The warning is loud, it lands in the job summary, and the script's own
          # refusal to report success while changing nothing is untouched.
          python3 android/patches/cairodrive_glance_icons.py resources || {
            echo "::warning::glance icon desaturation did not run - icons ship in COLOUR. Build continues; see the listing above for the names it actually found."
            find resources -maxdepth 3 -type d -name '*icon*' -print
          }

      # Checked out for EVERY core flavor, not just legacy. The OpenGL flavor takes its
      # *rendering* core from a prebuilt AAR, but the native *routing* library
      # (libosmand.so) is only ever produced by this tree's ndk-build, and without it
      # RouteProvider falls back to the Java router - measured at 6.8s average and 39s
      # worst-case per reroute on a real drive. old-ndk-build.sh runs
      # core-legacy/externals/configure.sh, so this checkout has to be present.
      - name: Checkout OsmAnd-core-legacy
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          # PINNED, and it has to stay pinned. old-ndk-build.sh executes
          # core-legacy/externals/configure.sh - a shell script out of this checkout - on the
          # same runner that has the decoded release keystore on disk. Unpinned, that is a
          # third-party repository's HEAD running against this fork's signing key with nobody
          # having read it, which is exactly the gap the production approval gate exists to
          # close. The reviewer approves a commit in THIS repo and cannot see what that
          # checkout will contain.
          #
          # Bump deliberately: read the diff, then update this SHA.
          ref: 071503e280d77c2a959d3690845f5e56b2c7e4b3
          path: core-legacy
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve variant names
        id: variant
        env:
          # Read through the environment, never interpolated into the script below. A
          # `${{ inputs.* }}` expression is pasted into the shell before it runs, so
          # `version_code="${{ inputs.version_code }}"` let anyone who can dispatch this
          # workflow close the quote and run their own commands on the runner.
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          capitalize() { printf '%s%s' "$(echo "${1:0:1}" | tr '[:lower:]' '[:upper:]')" "${1:1}"; }
          variant="Cairodrive$(capitalize "${CORE}")$(capitalize "${ABI}")"
          # build.gradle pins versionCode 5399 unless APK_NUMBER_VERSION overrides it, so
          # without this every dev build would carry the same code and Google Play would
          # reject the second one: a release can only be rolled out if its versionCode is
          # strictly greater than the one already live, otherwise no existing user has an
          # upgrade path. Minutes elapsed since 2026-01-01 is monotonic without depending
          # on run numbering (which resets if the workflow file is renamed), stays far
          # below Play's 2100000000 ceiling, and is already well above the pinned 5399.
          version_code="${VERSION_CODE_INPUT:-}"
          if [ -n "${version_code}" ] && ! printf '%s' "${version_code}" | grep -Eq '^[0-9]+$'; then
            echo "::error::version_code must be a positive integer, got '${version_code}'."
            exit 1
          fi
          if [ -z "${version_code}" ]; then
            version_code=$(( ( $(date -u +%s) - 1767225600 ) / 60 ))
          fi

          {
            echo "variant=${variant}"
            echo "bundle_task=:OsmAnd:bundle${variant}Release"
            echo "apk_release_task=:OsmAnd:assemble${variant}Release"
            echo "short_sha=$(git -C android rev-parse --short HEAD)"
            echo "app_edition=$(date -u +%Y-%m-%d)"
            echo "version_code=${version_code}"
          } >> "$GITHUB_OUTPUT"
          echo "versionCode for this build: ${version_code}"

          # The NDK is deliberately LEFT SET for every flavor now. It used to be blanked for
          # the OpenGL build so old-ndk-build.sh would exit early, on the assumption the
          # prebuilt AAR supplied everything native. It does not: the AAR ships the rendering
          # core (libOsmAndCoreWithJNI.so) but never libosmand.so, the C++ routing library.
          # Without it NativeOsmandLibrary fails to load on device ("dlopen failed: library
          # libosmand.so not found") and every reroute silently runs the Java router.
          # old-ndk-build.sh sets BUILD_ONLY_OLD_LIB=1, so this builds only the routing lib.
          echo "Native routing lib will be built with NDK at: ${ANDROID_NDK_ROOT:-<unset>}"

      - name: Check secrets
        run: |
          set -euo pipefail
          echo "::notice::Dev build - no release keystore on this runner by design; artifacts are debug-signed. Push a v* tag for a Play-uploadable build."
          if [ "${HAS_PLACES_KEY}" = "true" ]; then
            echo "Google Places search enabled."
          else
            echo "::warning::GOOGLE_PLACES_API_KEY is not set - search will fall back to the offline OSM index."
          fi

      # Seconds, and it runs BEFORE Gradle. The 2026-08-05 failure was two one-line mistakes -
      # a resource name that does not exist and an import from the wrong sub-package - and both
      # cost a full nine-minute build to discover, twice, because each one only surfaces at
      # javac. These three checkers find that class of error without a toolchain.
      #
      # Deliberately not a blocking gate on the R/import check: this runner HAS the resources
      # submodule, so cd-refcheck sees drawables and colours a local run cannot, and a checker
      # that can newly fail a build on a machine nobody can reproduce is worse than a noisy log.
      # The two that are deterministic everywhere do block.
      - name: Key wiring
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
        run: |
          # WARN, never fail: a build with no keys is a legitimate configuration and the app is
          # written to degrade to offline behaviour. What is NOT legitimate is not knowing.
          #
          # This exists because the env blocks below read CAIRODRIVE_TOMTOM_KEY and
          # CAIRODRIVE_OPENWEATHER_KEY, which are not secret names in this repository - the real
          # ones are TOMTOM_API_KEY and OPENWEATHER_KEY. GitHub resolves a missing secret to an
          # empty string with no warning, so TomTom traffic and the dust/weather hazards were
          # built with no key and were inert in every build, silently. Only the presence or
          # absence of each key is printed; no value is ever echoed.
          for pair in "GOOGLE_PLACES_API_KEY:search + Google traffic" \
                      "TOMTOM_API_KEY:TomTom traffic and closures" \
                      "OPENWEATHER_KEY:dust and air-quality warnings" \
                      "HERE_API_KEY:HERE raster traffic overlay" \
                      "BESTTIME_API_KEY:popular times" \
                      "GEOAPIFY_KEY:addresses and autocomplete" \
                      "LOCATIONIQ_KEY:address fallback (second geocoder)" \
                      "AZURE_MAPS_KEY:weather along the route" \
                      "TOMORROW_KEY:independent visibility check"; do
            name="${pair%%:*}"; what="${pair#*:}"
            if [ -n "${!name:-}" ]; then
              echo "  present : ${name}  (${what})"
            else
              echo "::warning::${name} is not set - ${what} will be inert in this build."
            fi
          done

      - name: Static checks
        working-directory: android
        run: |
          set -euo pipefail
          # Scoped to what this push CHANGED, not the whole tree. cd-typecheck resolves names
          # heuristically and cannot see external jars, so a full-tree run reports ~327 files -
          # gson and java.security wildcard imports, overwhelmingly - and a gate that is red on
          # a clean tree is a gate everyone learns to ignore. On changed files it is precise.
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::No usable base commit at depth 20 - skipping the static checks."
            exit 0
          fi
          CHANGED="$(git diff --name-only --diff-filter=d "${BEFORE}" HEAD -- '*.java' || true)"
          if [ -z "${CHANGED}" ]; then
            echo "No .java changed in this push - nothing to check."
            exit 0
          fi
          echo "${CHANGED}"
          # shellcheck disable=SC2086
          python3 tools/cd-typecheck.py ${CHANGED}
          # shellcheck disable=SC2086
          python3 tools/cd-abstract-check.py ${CHANGED}
          # Whole tree: this one is exact, and its import check needs every file as evidence.
          # Not blocking - this runner has the resources submodule, so it sees drawables and
          # colours a local run cannot, and a checker that can newly fail a build on a machine
          # nobody can reproduce is worse than a noisy log.
          python3 tools/cd-refcheck.py || echo "::warning::cd-refcheck reported findings - see above"

      - name: Configure Gradle memory
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          {
            echo
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> gradle.properties

      # No CAIRODRIVE_KEYSTORE_* here: cairodrive.gradle sees no keystore, repoints the
      # `publishing` signing config at keystores/debug.keystore and says so in its log.
      # The bundle still builds, which is what makes this a real smoke test of the release
      # variant (R8, the shrinker rules, the bundle task) without a key on the runner.
      - name: Build release bundle (AAB, debug-signed)
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # The secret NAMES in this repository are TOMTOM_API_KEY / OPENWEATHER_KEY /
          # HERE_API_KEY / BESTTIME_API_KEY. These lines used to read CAIRODRIVE_-prefixed
          # names that do not exist, and GitHub resolves a missing secret to an EMPTY STRING
          # with no warning - so TomTom traffic and the dust/weather hazards shipped with no
          # key and were inert, silently, in every build.
          CAIRODRIVE_TOMTOM_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CAIRODRIVE_OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          CAIRODRIVE_HERE_KEY: ${{ secrets.HERE_API_KEY }}
          # BestTime bills the forecast POST against the PRIVATE key; the public one is for
          # its browser widget and is not used here.
          CAIRODRIVE_BESTTIME_PRIVATE_KEY: ${{ secrets.BESTTIME_API_KEY }}
          CAIRODRIVE_GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          CAIRODRIVE_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          CAIRODRIVE_AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          CAIRODRIVE_TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          APK_NUMBER_VERSION: ${{ steps.variant.outputs.version_code }}
          BUNDLE_TASK: ${{ steps.variant.outputs.bundle_task }}
        run: ./gradlew --no-daemon --stacktrace "${BUNDLE_TASK}"

      # A failing :OsmAnd-java:test says only "There were failing tests, see the report at
      # file:///home/runner/..." - a path on a runner that no longer exists by the time anyone
      # reads it. The job log is ~20k lines and the NDK output alone overruns the tail window
      # the API will return, so the one line naming the broken test is unreachable. That turned
      # a red build into an unanswerable question rather than a fix.
      #
      # This prints the failure text straight into the log, and keeps the HTML report as an
      # artifact. `if: always()` because the interesting case is precisely the one where the
      # step above exited non-zero. It cannot itself fail the job.
      - name: Show failing tests
        if: always()
        working-directory: android
        run: |
          set +e
          found=0
          for xml in $(find . -path '*/build/test-results/*' -name 'TEST-*.xml' 2>/dev/null); do
            if grep -q '<failure\|<error' "$xml"; then
              found=1
              echo "::group::$(basename "$xml")"
              # The message= attribute and the stack trace body are what identify it.
              python3 - "$xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          for case in tree.iter('testcase'):
              for bad in list(case.findall('failure')) + list(case.findall('error')):
                  print("FAILED: %s.%s" % (case.get('classname'), case.get('name')))
                  print("  %s" % (bad.get('message') or bad.get('type') or '').strip()[:2000])
                  body = (bad.text or '').strip()
                  if body:
                      print('\n'.join('  ' + l for l in body.splitlines()[:40]))
                  print()
          PY
              echo "::endgroup::"
            fi
          done
          [ "$found" = 0 ] && echo "No failing test XML found (tests passed, or never ran)."

          # SLOWEST TESTS, printed whether or not anything failed.
          #
          # RouteTestingTest is wall-clock timed at @Test(timeout = 1500), so how close the
          # slowest cases run to that ceiling is the one number that says whether this suite is
          # healthy or one busy runner away from red. It is in the uploaded XML - and the XML is
          # only reachable by downloading the artifact, which is not always possible: GitHub
          # redirects artifact downloads to *.blob.core.windows.net, and an egress policy that
          # denies that host makes the report unreadable no matter what credentials you hold.
          # A number that decides whether a build is one step from failing should not depend on
          # reaching a third-party storage host.
          #
          # So it goes in the log, near the end, where the tail is readable. Same reasoning as
          # the provider keys in the summary.
          echo "::group::Slowest tests (headroom against the 1500 ms routing timeout)"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  try:
                      rows.append((float(case.get('time') or 0), case.get('classname') or '',
                                   case.get('name') or ''))
                  except ValueError:
                      pass
          rows.sort(reverse=True)
          if not rows:
              print("no test XML found")
          for t, cls, name in rows[:15]:
              print("%8.3fs  %s.%s" % (t, cls.rsplit('.', 1)[-1], name[:110]))

          # The TIMED tests, always, whatever their rank.
          #
          # The list above is the global slowest, and the routing cases are not the slowest -
          # they are merely the only ones that FAIL when slow. On the first run that printed it
          # the roadblock case came 15th of 15, one place from vanishing; a little faster and the
          # one number worth watching would have dropped off its own report. Rank is the wrong
          # selector for "is this close to its ceiling".
          timed = [r for r in rows if 'RouteTesting' in r[1]]
          if timed:
              print("")
              print("Routing tests against the 1500 ms @Test(timeout) ceiling:")
              worst, wcls, wname = timed[0]
              for t, cls, name in timed[:5]:
                  print("%8.3fs  %5.1f%% of budget  %s" % (t, t / 1.5 * 100, name[:90]))
              # One line a human can act on, and the one a future session should grep for.
              print("HEADROOM: %.0f ms spare on the worst routing test (%.1f%% of 1500 ms used)"
                    % ((1.5 - worst) * 1000, worst / 1.5 * 100))
          PY
          echo "::endgroup::"
          exit 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            android/*/build/reports/tests/
            android/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # The debug APK step was removed. Its stated reason was that only a debug build carried
      # the full diagnostic log - but cairodrive.gradle now sets CAIRODRIVE_FULL_LOGGING=true
      # for the release build type as well, precisely so that a Play-installed build (which
      # Android Auto requires, and which cannot be debuggable) still logs. The release APK
      # built below therefore has everything the debug one did, minus `debuggable`.
      #
      # What it cost: a complete second variant - javac and Kotlin over ~2,700 java and ~325 kt
      # sources plus OsmAnd-java and OsmAnd-shared, its own dexing, its own merge of the 62 MB
      # res tree, and the debugImplementation-only Compose tooling. On a 2-vCPU runner that was
      # a third of the job.
      #
      # Re-add it if a debugger is ever needed; -dontobfuscate is on and mapping.txt is
      # uploaded, so release stack traces are already readable without it.

      # Release build type of the same code, debug-signed: sideloadable for testing the
      # shrunk, optimised build (the AAB itself cannot be installed directly).
      - name: Build release APK (debug-signed)
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # The secret NAMES in this repository are TOMTOM_API_KEY / OPENWEATHER_KEY /
          # HERE_API_KEY / BESTTIME_API_KEY. These lines used to read CAIRODRIVE_-prefixed
          # names that do not exist, and GitHub resolves a missing secret to an EMPTY STRING
          # with no warning - so TomTom traffic and the dust/weather hazards shipped with no
          # key and were inert, silently, in every build.
          CAIRODRIVE_TOMTOM_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CAIRODRIVE_OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          CAIRODRIVE_HERE_KEY: ${{ secrets.HERE_API_KEY }}
          # BestTime bills the forecast POST against the PRIVATE key; the public one is for
          # its browser widget and is not used here.
          CAIRODRIVE_BESTTIME_PRIVATE_KEY: ${{ secrets.BESTTIME_API_KEY }}
          CAIRODRIVE_GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          CAIRODRIVE_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          CAIRODRIVE_AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          CAIRODRIVE_TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          APK_NUMBER_VERSION: ${{ steps.variant.outputs.version_code }}
          APK_RELEASE_TASK: ${{ steps.variant.outputs.apk_release_task }}
        run: |
          set -euo pipefail
          # Skip lintVital: measured at 1 min 9 s of this step's 2 min 4 s, and it gates nothing.
          # `warningsAsErrors false` (OsmAnd/build.gradle:63), and on the run this was measured
          # from, lint threw NegativeArraySizeException inside its own jar loader - it is already
          # failing to analyse and passing anyway.
          #
          # Only `assembleRelease` runs lintVital; `bundleRelease` never does. So the AAB step
          # above has never paid this, and skipping it here loses nothing the bundle checked.
          #
          # Task names are derived from APK_RELEASE_TASK (`:OsmAnd:assemble<Variant>Release`)
          # rather than hardcoded, because the variant changes with the abi/core inputs. If a
          # future AGP renames these tasks, `-x` fails with "Task not found" - loud and one line
          # to fix, which is the right failure mode for an optimisation.
          SUFFIX="${APK_RELEASE_TASK#:OsmAnd:assemble}"
          ./gradlew --no-daemon --stacktrace "${APK_RELEASE_TASK}" \
            -x ":OsmAnd:lintVitalAnalyze${SUFFIX}" \
            -x ":OsmAnd:lintVitalReport${SUFFIX}"

      # Fails the build if the native routing library did not make it into the artifacts.
      # This is the guard that was missing: the app degrades SILENTLY without libosmand.so -
      # it starts, renders and navigates, and only the reroute timings (6.8s average instead
      # of sub-second) reveal that the C++ router never loaded. A drive log was needed to
      # catch it last time. Now the build catches it.
      - name: Verify native routing library is bundled
        working-directory: android
        run: |
          set -euo pipefail
          # The list has to follow the ABI flavor, not be hardcoded. jni/Application.mk narrows
          # APP_ABI from the ARM64_ONLY / ARM_ONLY / ARMV7_ONLY / X86_ONLY flags that
          # build-common.gradle exports from the task name, so an arm64 build legitimately
          # produces one .so - and this loop, which asserted all four, failed it. Since this step
          # runs BEFORE the upload steps and none of them carry `if: always()`, that meant a full
          # build producing zero artifacts. Kept as an assertion, just an accurate one.
          case "${ABI}" in
            arm64)   expected="arm64-v8a" ;;
            armv7)   expected="armeabi-v7a" ;;
            armonly) expected="arm64-v8a armeabi-v7a" ;;
            x86)     expected="x86 x86_64" ;;
            fat)     expected="arm64-v8a armeabi-v7a x86 x86_64" ;;
            *)       echo "::error::Unknown ABI flavor '${ABI}' - add it to this case."; exit 1 ;;
          esac
          echo "ABI flavor '${ABI}' must produce: ${expected}"
          missing=0
          for abi in ${expected}; do
            if [ -f "OsmAnd/libs/${abi}/libosmand.so" ]; then
              echo "ok  ${abi}: $(stat -c%s "OsmAnd/libs/${abi}/libosmand.so") bytes"
            else
              echo "::error::libosmand.so missing for ${abi} - the C++ router will not load and every reroute will fall back to the slow Java engine."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Contents of OsmAnd/libs (for diagnosis):"
            ls -laR OsmAnd/libs 2>/dev/null || echo "OsmAnd/libs does not exist - ndk-build did not run"
            exit 1
          fi

      - name: Stage artifacts
        id: stage
        working-directory: android
        env:
          STAMP: ${{ github.run_number }}-${{ steps.variant.outputs.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for file in $(find OsmAnd/build/outputs/bundle -name '*.aab' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${STAMP}-$(basename "$file")"
          done
          for file in $(find OsmAnd/build/outputs/apk -name '*.apk' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${STAMP}-$(basename "$file")"
          done
          for file in $(find OsmAnd/build/outputs/mapping -name 'mapping.txt' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${STAMP}-$(basename "$(dirname "$file")")-mapping.txt"
          done
          ls -lh artifacts
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-aab-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-apk-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-mapping-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*-mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          # Through the environment rather than interpolated into the script - see the
          # longer note on the release job's summary for what that would otherwise allow.
          VARIANT: ${{ steps.variant.outputs.variant }}
          SHORT_SHA: ${{ steps.variant.outputs.short_sha }}
          VERSION_CODE: ${{ steps.variant.outputs.version_code }}
          # PRESENCE ONLY - `!= ''` yields the string true/false, so no key value can reach
          # the log, the summary or the environment. Same rule as the Key wiring step.
          #
          # Repeated at the END of the build on purpose. The Key wiring step runs 9th of 21 and
          # says the same thing, but a completed job's log is only readable from its tail through
          # the API, and GitHub Actions does not populate the check-run output that would carry
          # its ::warning:: annotations - so in practice that step's answer was unreadable
          # anywhere except the browser. Here it is in the job summary and in the last lines of
          # the log, which is where anything meant to be read after the fact belongs.
          HAS_PLACES: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}
          HAS_TOMTOM: ${{ secrets.TOMTOM_API_KEY != '' }}
          HAS_OPENWEATHER: ${{ secrets.OPENWEATHER_KEY != '' }}
          HAS_HERE: ${{ secrets.HERE_API_KEY != '' }}
          HAS_BESTTIME: ${{ secrets.BESTTIME_API_KEY != '' }}
          HAS_GEOAPIFY: ${{ secrets.GEOAPIFY_KEY != '' }}
          HAS_LOCATIONIQ: ${{ secrets.LOCATIONIQ_KEY != '' }}
          HAS_AZURE: ${{ secrets.AZURE_MAPS_KEY != '' }}
          HAS_TOMORROW: ${{ secrets.TOMORROW_KEY != '' }}
        run: |
          keyline() {
            if [ "$2" = "true" ]; then echo "- $1: present"; else echo "- $1: :warning: NOT SET - $3 is inert in this build"; fi
          }
          {
            echo "## CairoDrive dev build"
            echo
            echo "- Variant: \`${VARIANT}\`"
            echo "- Application id: \`com.cairodrive.app\`"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo "- versionCode: \`${VERSION_CODE}\`"
            if [ "${ABI}" = "fat" ]; then
              echo "- ABIs: \`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\`"
            else
              echo "- ABIs: :warning: \`${ABI}\` only - Play will refuse to roll this bundle out"
              echo "  to users on the ABIs it omits. Rebuild with the \`fat\` flavor to publish."
            fi
            echo "- Signing: debug keystore - installable for testing, **rejected by Google Play**."
            echo "  This is deliberate: dev builds run unattended, so the release keystore is not"
            echo "  on this runner at all. Push a \`v*\` tag to get a Play-uploadable, release-signed"
            echo "  build out of the \`production\` environment."
            if [ "${HAS_PLACES_KEY}" = "true" ]; then
              echo "- Search: Google Places"
            else
              echo "- Search: :warning: offline OSM index - \`GOOGLE_PLACES_API_KEY\` is not set"
            fi
            echo
            echo "### Provider keys"
            echo
            keyline "GOOGLE_PLACES_API_KEY" "${HAS_PLACES}" "search and Google traffic"
            keyline "TOMTOM_API_KEY" "${HAS_TOMTOM}" "traffic flow and closures"
            keyline "OPENWEATHER_KEY" "${HAS_OPENWEATHER}" "dust and air quality"
            keyline "HERE_API_KEY" "${HAS_HERE}" "HERE closures and overlay"
            keyline "BESTTIME_API_KEY" "${HAS_BESTTIME}" "popular times"
            keyline "GEOAPIFY_KEY" "${HAS_GEOAPIFY}" "addresses, autocomplete, nearby"
            keyline "LOCATIONIQ_KEY" "${HAS_LOCATIONIQ}" "address fallback"
            keyline "AZURE_MAPS_KEY" "${HAS_AZURE}" "weather along the route"
            keyline "TOMORROW_KEY" "${HAS_TOMORROW}" "independent visibility check"
            echo
            echo "The debug APK writes its full diagnostic trace to"
            echo "\`Android/data/com.cairodrive.app/files/cairodrive-logs\` on the device."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------
  # Release build. `environment: production` is the gate: with required reviewers set on
  # that environment (see .github/CICD.md) the job is held before its first step, so no
  # code from the tag - including any *.gradle file - executes until a human approves it.
  # The keystore secrets are stored on the environment, not on the repository, so this is
  # also the only job in the repository that can read them.
  #
  # The steps below duplicate the dev job rather than sharing it: GitHub has no include
  # for steps short of a composite action, and a reusable workflow would have to be handed
  # the secrets explicitly, which is more moving parts around a key than it is worth.
  # ---------------------------------------------------------------------------------
  release:
    name: Release build - signed
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      # Same hoisting as above - `secrets` is not available in a step-level `if:`. Each
      # credential is accepted under either name: the ANDROID_* spelling that the
      # repository already uses, or a CAIRODRIVE_* one for symmetry with the keystore
      # secret. `||` yields the first non-empty operand, so CAIRODRIVE_* wins when both
      # are set and neither name is mandatory.
      HAS_KEYSTORE: ${{ (secrets.CAIRODRIVE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64) != '' }}
      HAS_KEYSTORE_PASSWORD: ${{ (secrets.CAIRODRIVE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD) != '' }}
      HAS_KEY_ALIAS: ${{ (secrets.CAIRODRIVE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS) != '' }}
      HAS_KEY_PASSWORD: ${{ (secrets.CAIRODRIVE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD) != '' }}
      HAS_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}

    steps:
      # Checked before anything is compiled: an incomplete secret set would otherwise be
      # discovered by the signer at the very end of a twenty minute build, and unlike a dev
      # build there is no point in a release that silently fell back to the debug keystore.
      - name: Verify signing credentials
        run: |
          set -euo pipefail
          missing=""
          [ "${HAS_KEYSTORE}" = "true" ] || missing="${missing} CAIRODRIVE_KEYSTORE_BASE64"
          [ "${HAS_KEYSTORE_PASSWORD}" = "true" ] || missing="${missing} CAIRODRIVE_KEYSTORE_PASSWORD"
          [ "${HAS_KEY_ALIAS}" = "true" ] || missing="${missing} CAIRODRIVE_KEY_ALIAS"
          [ "${HAS_KEY_PASSWORD}" = "true" ] || missing="${missing} CAIRODRIVE_KEY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::Release build, but these secrets are missing from the production environment:${missing}. Add them under Settings > Environments > production (the ANDROID_* spelling of each is accepted too)."
            exit 1
          fi
          echo "Release signing fully configured."

      - name: Checkout CairoDrive
        uses: actions/checkout@v7
        with:
          path: android
          persist-credentials: false

      - name: Checkout OsmAnd-resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          # PINNED, like OsmAnd-core-legacy below it.
          #
          # Unpinned, this took upstream's default branch live on every build - and this checkout
          # is not incidental: routing.xml comes from it (Gradle Syncs it into OsmAnd-java, then
          # the patch step below adds the fork's narrow-street rules), as do rendering_types,
          # poi_types and the routing test maps. So an upstream push could change the routing
          # profile INSIDE A SHIPPED APK with no commit in this repository, and change it between
          # two builds of the same commit.
          #
          # For the record: this was my first suspect for the routing test that started failing
          # after the merge, and it was NOT the cause - that repo's last commit was hours before
          # both the green and the red builds. Pinning is worth doing on its own merits, not as a
          # fix for that.
          #
          # To take a newer upstream: bump this SHA in its own commit, so the change is reviewable
          # and bisectable like any other.
          ref: d87f3d4f6270974e7222b7fbddcc9e4c911ade85
          path: resources
          persist-credentials: false
      - name: Apply CairoDrive routing profile patches
        run: |
          set -euo pipefail
          python3 android/patches/cairodrive_narrow_streets.py resources/routing/routing.xml
          # Drops proj.db and the CJK / South Asian / South-East Asian / Tibetan fonts - 17 MB
          # of assets no Egyptian map uses - AND the matching bundled_assets.json entries, in
          # one atomic step. It has to be one step: CheckAssetsTask.unpackBundledAssets has no
          # per-entry catch, so an asset listed in the manifest but absent from the APK aborts
          # the whole unpack and the app silently comes up with no fonts, no voice prompts and
          # no basemap. The script refuses to half-apply, and asserts the Arabic Nastaliq font
          # survives - it is the only font in the manifest covering Arabic script, so losing it
          # would turn every Cairo street label into empty boxes.
          python3 android/patches/cairodrive_trim_assets.py resources
          # B3. Injects the glance style, gated on a rendering property - so this runs
          # unconditionally and does nothing until `cairodriveDriving` is on. That property now
          # DEFAULTS on, and can still be flipped in Configure map mid-drive without a rebuild.
          # Applying it always keeps the two CI jobs producing identical styles.
          python3 android/patches/cairodrive_driving_style.py resources/rendering_styles/default.render.xml
          # B3, icons. Desaturates the POI icons the glance style still draws, keeping shape and
          # alpha and dropping only hue, so they stop competing with the route line and the arrow.
          #
          # READ THIS BEFORE ASSUMING IT BEHAVES LIKE THE LINE ABOVE. That one edits XML behind a
          # runtime switch; this one edits BITMAPS. Turning the glance style off in Configure map
          # does NOT bring the colour back - only a build without this step does. It is
          # unconditional for the same reason the style patch is: two jobs, identical output.
          #
          # Fuel, charging, hazard, traffic, speed, railway, barrier, emergency, hospital,
          # pharmacy, police and toll keep their colour - those are the ones where colour IS the
          # information a driver acts on.
          #
          # The script REFUSES to match zero icons rather than reporting success and changing
          # nothing, so an upstream rename fails the build here instead of shipping a silently
          # unchanged icon set. The listing below turns that failure into a one-cycle diagnosis
          # rather than a guess at what upstream renamed.
          # NON-BLOCKING, and that is a deliberate correction. The first wiring of this used
          # `exit 1`, matching the three scripts above. Those three earn it: a missing routing
          # profile, a half-trimmed asset manifest or an unpatched style all produce an app that
          # is wrong in ways a drive cannot reveal. Icon HUE does not - the worst case is icons
          # that stay colourful, which is simply the previous build.
          #
          # It cost three commits of zero compile signal to learn that, because this step gates
          # every later step including the compile. A cosmetic patch must never be able to do
          # that again. The warning is loud, it lands in the job summary, and the script's own
          # refusal to report success while changing nothing is untouched.
          python3 android/patches/cairodrive_glance_icons.py resources || {
            echo "::warning::glance icon desaturation did not run - icons ship in COLOUR. Build continues; see the listing above for the names it actually found."
            find resources -maxdepth 3 -type d -name '*icon*' -print
          }

      # Checked out for EVERY core flavor, not just legacy. The OpenGL flavor takes its
      # *rendering* core from a prebuilt AAR, but the native *routing* library
      # (libosmand.so) is only ever produced by this tree's ndk-build, and without it
      # RouteProvider falls back to the Java router - measured at 6.8s average and 39s
      # worst-case per reroute on a real drive. old-ndk-build.sh runs
      # core-legacy/externals/configure.sh, so this checkout has to be present.
      - name: Checkout OsmAnd-core-legacy
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          # PINNED, and it has to stay pinned. old-ndk-build.sh executes
          # core-legacy/externals/configure.sh - a shell script out of this checkout - on the
          # same runner that has the decoded release keystore on disk. Unpinned, that is a
          # third-party repository's HEAD running against this fork's signing key with nobody
          # having read it, which is exactly the gap the production approval gate exists to
          # close. The reviewer approves a commit in THIS repo and cannot see what that
          # checkout will contain.
          #
          # Bump deliberately: read the diff, then update this SHA.
          ref: 071503e280d77c2a959d3690845f5e56b2c7e4b3
          path: core-legacy
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          # cache: gradle is deliberately ABSENT here, unlike the dev job. setup-java caches
          # ~/.gradle/caches, which with org.gradle.caching=true includes build-cache-1 - task
          # outputs, not just downloaded jars - and both jobs would compute the same key on the
          # same ref. A dispatch with sign=true runs on `dev`, so the signed job would restore a
          # cache that every unapproved push build on that branch has been writing to. The
          # reviewer's approval covers the source at that commit, not a cache entry planted
          # before it. A signed build reuses nothing an unsigned one produced.
          distribution: 'temurin'

      - name: Resolve variant names
        id: variant
        env:
          # Through the environment, not interpolated - see the note in the dev job.
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          capitalize() { printf '%s%s' "$(echo "${1:0:1}" | tr '[:lower:]' '[:upper:]')" "${1:1}"; }
          variant="Cairodrive$(capitalize "${CORE}")$(capitalize "${ABI}")"
          version_code="${VERSION_CODE_INPUT:-}"
          if [ -n "${version_code}" ] && ! printf '%s' "${version_code}" | grep -Eq '^[0-9]+$'; then
            echo "::error::version_code must be a positive integer, got '${version_code}'."
            exit 1
          fi
          # Same monotonic default as the dev job: minutes since 2026-01-01, which Play
          # accepts as strictly increasing against anything this fork has uploaded before.
          if [ -z "${version_code}" ]; then
            version_code=$(( ( $(date -u +%s) - 1767225600 ) / 60 ))
          fi

          {
            echo "variant=${variant}"
            echo "bundle_task=:OsmAnd:bundle${variant}Release"
            echo "apk_release_task=:OsmAnd:assemble${variant}Release"
            echo "short_sha=$(git -C android rev-parse --short HEAD)"
            echo "app_edition=$(date -u +%Y-%m-%d)"
            echo "version_code=${version_code}"
          } >> "$GITHUB_OUTPUT"
          echo "versionCode for this build: ${version_code}"

          # The NDK is deliberately LEFT SET for every flavor now. It used to be blanked for
          # the OpenGL build so old-ndk-build.sh would exit early, on the assumption the
          # prebuilt AAR supplied everything native. It does not: the AAR ships the rendering
          # core (libOsmAndCoreWithJNI.so) but never libosmand.so, the C++ routing library.
          # Without it NativeOsmandLibrary fails to load on device ("dlopen failed: library
          # libosmand.so not found") and every reroute silently runs the Java router.
          # old-ndk-build.sh sets BUILD_ONLY_OLD_LIB=1, so this builds only the routing lib.
          echo "Native routing lib will be built with NDK at: ${ANDROID_NDK_ROOT:-<unset>}"

      - name: Configure Gradle memory
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          {
            echo
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> gradle.properties

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CAIRODRIVE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAIRODRIVE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/keystore/release.jks"
          echo "path=${RUNNER_TEMP}/keystore/release.jks" >> "$GITHUB_OUTPUT"

          # Signing runs as the very last task of a long build, so a keystore that cannot
          # be opened is worth catching now. keytool prints the alias list, which also
          # confirms CAIRODRIVE_KEY_ALIAS names a key that is actually in there.
          #
          # Password on stdin, not argv: an argument would be visible in /proc/<pid>/cmdline
          # to anything else on the runner. Harmless on an ephemeral GitHub runner, a real
          # exposure the day this moves to a self-hosted one.
          if ! aliases=$(printf '%s\n' "${KEYSTORE_PASSWORD}" \
              | keytool -list -keystore "${RUNNER_TEMP}/keystore/release.jks" 2>&1); then
            echo "::error::The release keystore could not be opened with the supplied password."
            echo "${aliases}" | grep -v -i 'password\|Warning' || true
            exit 1
          fi
          echo "Keystore opened. Aliases present:"
          echo "${aliases}" | grep -i 'PrivateKeyEntry\|trustedCertEntry' || true
          if ! printf '%s' "${aliases}" | grep -qi "^${KEY_ALIAS},"; then
            echo "::warning::The alias in CAIRODRIVE_KEY_ALIAS/ANDROID_KEY_ALIAS was not found in the keystore listing above."
          fi

      - name: Build release bundle (AAB)
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # The secret NAMES in this repository are TOMTOM_API_KEY / OPENWEATHER_KEY /
          # HERE_API_KEY / BESTTIME_API_KEY. These lines used to read CAIRODRIVE_-prefixed
          # names that do not exist, and GitHub resolves a missing secret to an EMPTY STRING
          # with no warning - so TomTom traffic and the dust/weather hazards shipped with no
          # key and were inert, silently, in every build.
          CAIRODRIVE_TOMTOM_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CAIRODRIVE_OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          CAIRODRIVE_HERE_KEY: ${{ secrets.HERE_API_KEY }}
          # BestTime bills the forecast POST against the PRIVATE key; the public one is for
          # its browser widget and is not used here.
          CAIRODRIVE_BESTTIME_PRIVATE_KEY: ${{ secrets.BESTTIME_API_KEY }}
          CAIRODRIVE_GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          CAIRODRIVE_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          CAIRODRIVE_AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          CAIRODRIVE_TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          APK_NUMBER_VERSION: ${{ steps.variant.outputs.version_code }}
          CAIRODRIVE_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CAIRODRIVE_KEYSTORE_PASSWORD: ${{ secrets.CAIRODRIVE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAIRODRIVE_KEY_ALIAS: ${{ secrets.CAIRODRIVE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          CAIRODRIVE_KEY_PASSWORD: ${{ secrets.CAIRODRIVE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          BUNDLE_TASK: ${{ steps.variant.outputs.bundle_task }}
        run: ./gradlew --no-daemon --stacktrace "${BUNDLE_TASK}"

      # Same reasoning as the build job's copy - and it matters more here, because this job is
      # behind the `production` reviewer gate. A test failure with no named test costs an
      # approval AND leaves nothing to act on.
      - name: Show failing tests
        if: always()
        working-directory: android
        run: |
          set +e
          found=0
          for xml in $(find . -path '*/build/test-results/*' -name 'TEST-*.xml' 2>/dev/null); do
            if grep -q '<failure\|<error' "$xml"; then
              found=1
              echo "::group::$(basename "$xml")"
              python3 - "$xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          for case in tree.iter('testcase'):
              for bad in list(case.findall('failure')) + list(case.findall('error')):
                  print("FAILED: %s.%s" % (case.get('classname'), case.get('name')))
                  print("  %s" % (bad.get('message') or bad.get('type') or '').strip()[:2000])
                  body = (bad.text or '').strip()
                  if body:
                      print('\n'.join('  ' + l for l in body.splitlines()[:40]))
                  print()
          PY
              echo "::endgroup::"
            fi
          done
          [ "$found" = 0 ] && echo "No failing test XML found (tests passed, or never ran)."

          # SLOWEST TESTS, printed whether or not anything failed.
          #
          # RouteTestingTest is wall-clock timed at @Test(timeout = 1500), so how close the
          # slowest cases run to that ceiling is the one number that says whether this suite is
          # healthy or one busy runner away from red. It is in the uploaded XML - and the XML is
          # only reachable by downloading the artifact, which is not always possible: GitHub
          # redirects artifact downloads to *.blob.core.windows.net, and an egress policy that
          # denies that host makes the report unreadable no matter what credentials you hold.
          # A number that decides whether a build is one step from failing should not depend on
          # reaching a third-party storage host.
          #
          # So it goes in the log, near the end, where the tail is readable. Same reasoning as
          # the provider keys in the summary.
          echo "::group::Slowest tests (headroom against the 1500 ms routing timeout)"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  try:
                      rows.append((float(case.get('time') or 0), case.get('classname') or '',
                                   case.get('name') or ''))
                  except ValueError:
                      pass
          rows.sort(reverse=True)
          if not rows:
              print("no test XML found")
          for t, cls, name in rows[:15]:
              print("%8.3fs  %s.%s" % (t, cls.rsplit('.', 1)[-1], name[:110]))

          # The TIMED tests, always, whatever their rank.
          #
          # The list above is the global slowest, and the routing cases are not the slowest -
          # they are merely the only ones that FAIL when slow. On the first run that printed it
          # the roadblock case came 15th of 15, one place from vanishing; a little faster and the
          # one number worth watching would have dropped off its own report. Rank is the wrong
          # selector for "is this close to its ceiling".
          timed = [r for r in rows if 'RouteTesting' in r[1]]
          if timed:
              print("")
              print("Routing tests against the 1500 ms @Test(timeout) ceiling:")
              worst, wcls, wname = timed[0]
              for t, cls, name in timed[:5]:
                  print("%8.3fs  %5.1f%% of budget  %s" % (t, t / 1.5 * 100, name[:90]))
              # One line a human can act on, and the one a future session should grep for.
              print("HEADROOM: %.0f ms spare on the worst routing test (%.1f%% of 1500 ms used)"
                    % ((1.5 - worst) * 1000, worst / 1.5 * 100))
          PY
          echo "::endgroup::"
          exit 0

      # Release-signed APK of the same code that goes into the bundle, for sideload
      # testing of the exact shipping build (the AAB itself cannot be installed directly).
      - name: Build release APK
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # The secret NAMES in this repository are TOMTOM_API_KEY / OPENWEATHER_KEY /
          # HERE_API_KEY / BESTTIME_API_KEY. These lines used to read CAIRODRIVE_-prefixed
          # names that do not exist, and GitHub resolves a missing secret to an EMPTY STRING
          # with no warning - so TomTom traffic and the dust/weather hazards shipped with no
          # key and were inert, silently, in every build.
          CAIRODRIVE_TOMTOM_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CAIRODRIVE_OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          CAIRODRIVE_HERE_KEY: ${{ secrets.HERE_API_KEY }}
          # BestTime bills the forecast POST against the PRIVATE key; the public one is for
          # its browser widget and is not used here.
          CAIRODRIVE_BESTTIME_PRIVATE_KEY: ${{ secrets.BESTTIME_API_KEY }}
          CAIRODRIVE_GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          CAIRODRIVE_LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          CAIRODRIVE_AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          CAIRODRIVE_TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          APK_NUMBER_VERSION: ${{ steps.variant.outputs.version_code }}
          CAIRODRIVE_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CAIRODRIVE_KEYSTORE_PASSWORD: ${{ secrets.CAIRODRIVE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAIRODRIVE_KEY_ALIAS: ${{ secrets.CAIRODRIVE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          CAIRODRIVE_KEY_PASSWORD: ${{ secrets.CAIRODRIVE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          APK_RELEASE_TASK: ${{ steps.variant.outputs.apk_release_task }}
        run: |
          set -euo pipefail
          # Skip lintVital: measured at 1 min 9 s of this step's 2 min 4 s, and it gates nothing.
          # `warningsAsErrors false` (OsmAnd/build.gradle:63), and on the run this was measured
          # from, lint threw NegativeArraySizeException inside its own jar loader - it is already
          # failing to analyse and passing anyway.
          #
          # Only `assembleRelease` runs lintVital; `bundleRelease` never does. So the AAB step
          # above has never paid this, and skipping it here loses nothing the bundle checked.
          #
          # Task names are derived from APK_RELEASE_TASK (`:OsmAnd:assemble<Variant>Release`)
          # rather than hardcoded, because the variant changes with the abi/core inputs. If a
          # future AGP renames these tasks, `-x` fails with "Task not found" - loud and one line
          # to fix, which is the right failure mode for an optimisation.
          SUFFIX="${APK_RELEASE_TASK#:OsmAnd:assemble}"
          ./gradlew --no-daemon --stacktrace "${APK_RELEASE_TASK}" \
            -x ":OsmAnd:lintVitalAnalyze${SUFFIX}" \
            -x ":OsmAnd:lintVitalReport${SUFFIX}"

      # Fails the build if the native routing library did not make it into the artifacts.
      # This is the guard that was missing: the app degrades SILENTLY without libosmand.so -
      # it starts, renders and navigates, and only the reroute timings (6.8s average instead
      # of sub-second) reveal that the C++ router never loaded. A drive log was needed to
      # catch it last time. Now the build catches it.
      - name: Verify native routing library is bundled
        working-directory: android
        run: |
          set -euo pipefail
          # The list has to follow the ABI flavor, not be hardcoded. jni/Application.mk narrows
          # APP_ABI from the ARM64_ONLY / ARM_ONLY / ARMV7_ONLY / X86_ONLY flags that
          # build-common.gradle exports from the task name, so an arm64 build legitimately
          # produces one .so - and this loop, which asserted all four, failed it. Since this step
          # runs BEFORE the upload steps and none of them carry `if: always()`, that meant a full
          # build producing zero artifacts. Kept as an assertion, just an accurate one.
          case "${ABI}" in
            arm64)   expected="arm64-v8a" ;;
            armv7)   expected="armeabi-v7a" ;;
            armonly) expected="arm64-v8a armeabi-v7a" ;;
            x86)     expected="x86 x86_64" ;;
            fat)     expected="arm64-v8a armeabi-v7a x86 x86_64" ;;
            *)       echo "::error::Unknown ABI flavor '${ABI}' - add it to this case."; exit 1 ;;
          esac
          echo "ABI flavor '${ABI}' must produce: ${expected}"
          missing=0
          for abi in ${expected}; do
            if [ -f "OsmAnd/libs/${abi}/libosmand.so" ]; then
              echo "ok  ${abi}: $(stat -c%s "OsmAnd/libs/${abi}/libosmand.so") bytes"
            else
              echo "::error::libosmand.so missing for ${abi} - the C++ router will not load and every reroute will fall back to the slow Java engine."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Contents of OsmAnd/libs (for diagnosis):"
            ls -laR OsmAnd/libs 2>/dev/null || echo "OsmAnd/libs does not exist - ndk-build did not run"
            exit 1
          fi

      - name: Stage artifacts
        id: stage
        working-directory: android
        env:
          STAMP: ${{ github.run_number }}-${{ steps.variant.outputs.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for file in $(find OsmAnd/build/outputs/bundle -name '*.aab' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${STAMP}-$(basename "$file")"
          done
          for file in $(find OsmAnd/build/outputs/apk -name '*.apk' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${STAMP}-$(basename "$file")"
          done
          for file in $(find OsmAnd/build/outputs/mapping -name 'mapping.txt' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${STAMP}-$(basename "$(dirname "$file")")-mapping.txt"
          done
          ls -lh artifacts
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-release-aab-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-release-apk-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      # Keep this one: without the mapping file a crash report from the shipped build is
      # unreadable, and it cannot be regenerated once the build environment is gone.
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-release-mapping-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*-mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          # Through the environment, not interpolated. git permits `$`, backticks and
          # parentheses in a tag name, so `${{ github.ref_name }}` pasted into this script
          # would let a tag called `v$(...)` run commands - in the one job that has the
          # keystore decoded on disk. The others are internally generated but follow the
          # same rule so that nobody has to work out which is which.
          REF_NAME: ${{ github.ref_name }}
          VARIANT: ${{ steps.variant.outputs.variant }}
          SHORT_SHA: ${{ steps.variant.outputs.short_sha }}
          VERSION_CODE: ${{ steps.variant.outputs.version_code }}
          STAMP: ${{ steps.stage.outputs.stamp }}
        run: |
          {
            echo "## CairoDrive release build"
            echo
            echo "- Ref: \`${REF_NAME}\`"
            echo "- Variant: \`${VARIANT}\`"
            echo "- Application id: \`com.cairodrive.app\`"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo "- versionCode: \`${VERSION_CODE}\`"
            if [ "${ABI}" = "fat" ]; then
              echo "- ABIs: \`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\`"
            else
              echo "- ABIs: :warning: \`${ABI}\` only - Play will refuse to roll this bundle out"
              echo "  to users on the ABIs it omits. Rebuild with the \`fat\` flavor to publish."
            fi
            echo "- Signing: release keystore from the \`production\` environment - **uploadable to Google Play**"
            if [ "${HAS_PLACES_KEY}" = "true" ]; then
              echo "- Search: Google Places"
            else
              echo "- Search: :warning: offline OSM index - \`GOOGLE_PLACES_API_KEY\` is not set"
            fi
            echo
            echo "Keep \`cairodrive-release-mapping-${STAMP}\` for as long as"
            echo "this build is installed anywhere: release stack traces cannot be read without it."
          } >> "$GITHUB_STEP_SUMMARY"
