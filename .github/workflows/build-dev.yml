name: Build CairoDrive (dev)

# Produces the two shippable artifacts for every dev build:
#   * an AAB  - the Google Play upload format
#   * an APK  - sideloadable test build with the verbose on-device logger enabled
#
# The variant is the CairoDrive flavor (applicationId com.cairodrive.app, see
# OsmAnd/cairodrive.gradle) built for a single ABI against the prebuilt OpenGL core
# AAR, which is the fastest combination the project offers: no NDK compilation and
# no fat-APK multiplication.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI flavor'
        type: choice
        required: false
        default: 'arm64'
        options: [arm64, armonly, armv7, x86, fat]
      core:
        description: 'Core flavor. legacy compiles the native core with the NDK and is much slower.'
        type: choice
        required: false
        default: 'opengl'
        options: [opengl, legacy]
      version_code:
        description: 'Override versionCode (leave empty to use the value in build.gradle)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: ${{ inputs.abi || 'arm64' }}
  CORE: ${{ inputs.core || 'opengl' }}

jobs:
  build:
    name: Bundle + APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The `secrets` context is not available in a step-level `if:` - only in a step's
      # `env:`/`with:`/`run:` and in a job-level `env:` like this one. Testing the secret
      # directly in the `if:` below would make the whole workflow file fail to parse with
      # "Unrecognized named-value: 'secrets'", so the presence check is hoisted here.
      HAS_KEYSTORE: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 != '' }}

    steps:
      # OsmAnd's build scripts reach out of the module with ../../resources, so the
      # sibling repositories have to sit next to the checkout, not inside it.
      - name: Checkout CairoDrive
        uses: actions/checkout@v7
        with:
          path: android

      - name: Checkout OsmAnd-resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd-core-legacy
        if: env.CORE == 'legacy'
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve variant names
        id: variant
        run: |
          set -euo pipefail
          capitalize() { printf '%s%s' "$(echo "${1:0:1}" | tr '[:lower:]' '[:upper:]')" "${1:1}"; }
          variant="Cairodrive$(capitalize "${CORE}")$(capitalize "${ABI}")"
          {
            echo "variant=${variant}"
            echo "bundle_task=:OsmAnd:bundle${variant}Release"
            echo "apk_debug_task=:OsmAnd:assemble${variant}Debug"
            echo "apk_release_task=:OsmAnd:assemble${variant}Release"
            echo "short_sha=$(git -C android rev-parse --short HEAD)"
            echo "app_edition=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

          # The legacy core is the only variant that compiles native code. Blanking the
          # NDK location for the OpenGL build makes old-ndk-build.sh exit early instead
          # of building a core that the OpenGL variant takes from a prebuilt AAR anyway.
          if [ "${CORE}" != "legacy" ]; then
            echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
            echo "ANDROID_NDK=" >> "$GITHUB_ENV"
          fi

      - name: Configure Gradle memory
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          {
            echo
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> gradle.properties

      # Optional. Without these secrets the release artifacts are signed with the
      # checked-in debug keystore: fine for sideloading, rejected by Google Play.
      - name: Decode release keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/keystore/release.jks"
          echo "path=${RUNNER_TEMP}/keystore/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release bundle (AAB)
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          APK_NUMBER_VERSION: ${{ inputs.version_code }}
          CAIRODRIVE_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CAIRODRIVE_KEYSTORE_PASSWORD: ${{ secrets.CAIRODRIVE_KEYSTORE_PASSWORD }}
          CAIRODRIVE_KEY_ALIAS: ${{ secrets.CAIRODRIVE_KEY_ALIAS }}
          CAIRODRIVE_KEY_PASSWORD: ${{ secrets.CAIRODRIVE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace ${{ steps.variant.outputs.bundle_task }}

      # Debug build: CAIRODRIVE_FULL_LOGGING defaults to true here, so this APK writes
      # the full diagnostic trace to Android/data/com.cairodrive.app/files/cairodrive-logs.
      - name: Build debug APK
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          APK_VERSION_SUFFIX: '#${{ github.run_number }}-${{ steps.variant.outputs.short_sha }}'
        run: ./gradlew --no-daemon --stacktrace ${{ steps.variant.outputs.apk_debug_task }}

      # Release-signed APK of the same code that goes into the bundle, for sideload
      # testing of the exact shipping build (the AAB itself cannot be installed directly).
      - name: Build release APK
        working-directory: android
        env:
          APP_EDITION: ${{ steps.variant.outputs.app_edition }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          APK_NUMBER_VERSION: ${{ inputs.version_code }}
          CAIRODRIVE_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CAIRODRIVE_KEYSTORE_PASSWORD: ${{ secrets.CAIRODRIVE_KEYSTORE_PASSWORD }}
          CAIRODRIVE_KEY_ALIAS: ${{ secrets.CAIRODRIVE_KEY_ALIAS }}
          CAIRODRIVE_KEY_PASSWORD: ${{ secrets.CAIRODRIVE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace ${{ steps.variant.outputs.apk_release_task }}

      - name: Stage artifacts
        id: stage
        working-directory: android
        run: |
          set -euo pipefail
          stamp="${{ github.run_number }}-${{ steps.variant.outputs.short_sha }}"
          mkdir -p artifacts
          for file in $(find OsmAnd/build/outputs/bundle -name '*.aab' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${stamp}-$(basename "$file")"
          done
          for file in $(find OsmAnd/build/outputs/apk -name '*.apk' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${stamp}-$(basename "$file")"
          done
          for file in $(find OsmAnd/build/outputs/mapping -name 'mapping.txt' 2>/dev/null || true); do
            cp "$file" "artifacts/CairoDrive-${stamp}-$(basename "$(dirname "$file")")-mapping.txt"
          done
          ls -lh artifacts
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-aab-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-apk-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v7
        with:
          name: cairodrive-mapping-${{ steps.stage.outputs.stamp }}
          path: android/artifacts/*-mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo "## CairoDrive dev build"
            echo
            echo "- Variant: \`${{ steps.variant.outputs.variant }}\`"
            echo "- Application id: \`com.cairodrive.app\`"
            echo "- Commit: \`${{ steps.variant.outputs.short_sha }}\`"
            if [ -n "${{ steps.keystore.outputs.path }}" ]; then
              echo "- Signing: release keystore from repository secrets - **uploadable to Google Play**"
            else
              echo "- Signing: :warning: debug keystore fallback - installable for testing, **rejected by Google Play**."
              echo "  Add the \`CAIRODRIVE_KEYSTORE_BASE64\`, \`CAIRODRIVE_KEYSTORE_PASSWORD\`,"
              echo "  \`CAIRODRIVE_KEY_ALIAS\` and \`CAIRODRIVE_KEY_PASSWORD\` secrets to sign for release."
            fi
            echo
            echo "The debug APK writes its full diagnostic trace to"
            echo "\`Android/data/com.cairodrive.app/files/cairodrive-logs\` on the device."
          } >> "$GITHUB_STEP_SUMMARY"
