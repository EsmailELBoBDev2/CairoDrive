name: Patch Magic Earth with search hook (Frida gadget)

# Manual trigger ONLY — never on push/PR. This build produces a repackaged,
# re-signed copy of a real third-party commercial app (Magic Earth). It should
# only ever happen when someone deliberately clicks "Run workflow".
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Merge splits, embed gadget, patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install objection
        run: pip install objection

      # The original artifact set (a .7z-split APKMirror .apkm bundle of the
      # real Magic Earth app) already lives in this repo's root — see
      # reports/original-archive-checksums.txt for its recorded hashes.
      - name: Extract and merge Magic Earth APKs using zipalign
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          mkdir -p original apks
          # 7-Zip's -o output-dir switch MUST be glued to the path (no space).
          7z x -y -ooriginal CairoDrive.7z.001
          APKM=$(find original -iname '*.apkm' | head -1)
          echo "APKM: $APKM"
          # Extract the APKs from the .apkm (which is just a ZIP/zip-compatible format)
          unzip -o -q "$APKM" -d apks
          echo "Extracted APKs:"
          ls -lh apks/

          # Find base APK (usually the largest and contains core app)
          BASE_APK=$(find apks -name "base.apk" -o -name "base-*.apk" | head -1)
          if [ -z "$BASE_APK" ]; then
            # Fallback: get largest APK file
            BASE_APK=$(ls -S apks/*.apk | head -1)
          fi
          echo "Using base APK: $BASE_APK"
          cp "$BASE_APK" merged.apk
          ls -lh merged.apk

      - name: Install apktool (objection shells out to it)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq apktool

      - name: Embed Frida gadget (search hook, autoload script mode)
        run: |
          set -euo pipefail
          # --skip-resources: Magic Earth is a ~150MB commercial Flutter app;
          # apktool's full resource recompile routinely fails on apps this size.
          # --ignore-nativelibs is REQUIRED alongside --skip-resources (objection
          # refuses to start otherwise): with resources undecoded, objection can't
          # safely re-parse AndroidManifest.xml, so it skips only the
          # extractNativeLibs="false"->"true" manifest tweak. The two steps that
          # actually embed the gadget — injecting the loadLibrary() smali call and
          # copying libfrida-gadget.so into lib/<arch>/ — run unconditionally in
          # objection's source regardless of this flag, so the gadget still loads.
          # INTERNET permission injection also still runs (Magic Earth already
          # declares it, so this is a no-op check, not a manifest rewrite).
          objection patchapk \
            --source merged.apk \
            --architecture arm64-v8a \
            --gadget-config patch/gadget-config.json \
            -l patch/frida/cairodrive-search-hook.js \
            --skip-resources \
            --ignore-nativelibs
          ls -la merged.objection.apk

      - name: Sanity check — confirm this is Magic Earth, re-signed, not a fresh app
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BUILD_TOOLS" ]; then
            PKG=$("$BUILD_TOOLS/aapt2" dump packagename merged.objection.apk || true)
            echo "package: $PKG"
            if [ "$PKG" != "com.generalmagic.magicearth" ]; then
              echo "::warning::package name is '$PKG', expected com.generalmagic.magicearth"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: magicearth-patched
          path: merged.objection.apk
          if-no-files-found: error
          retention-days: 7
