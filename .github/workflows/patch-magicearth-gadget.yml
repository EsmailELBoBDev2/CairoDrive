name: Patch Magic Earth with search hook (Frida gadget)

# Manual trigger ONLY — never on push/PR. This build produces a repackaged,
# re-signed copy of a real third-party commercial app (Magic Earth). It should
# only ever happen when someone deliberately clicks "Run workflow".
#
# WHY THE OUTPUT IS ENCRYPTED, NOT PLAIN:
# On a public repo, Actions artifacts are downloadable by anyone — so uploading
# a ready-to-run repackaged copy of someone else's proprietary app would make
# this repo a public distribution point for it. Instead the build ENCRYPTS the
# APK (AES-256, symmetric) with a passphrase only the repo owner knows (the
# ARTIFACT_PASSPHRASE secret) and uploads only that ciphertext. The public
# artifact is useless without the key; the owner decrypts it locally. This
# works the same whether the repo is public or private, so there is no
# visibility gate to satisfy.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Merge splits, embed gadget, patch, encrypt
    runs-on: ubuntu-latest
    steps:
      # Fail FAST if the passphrase secret is missing, before doing any build
      # work — we must never fall through to uploading a plaintext APK.
      - name: Require ARTIFACT_PASSPHRASE secret
        env:
          PASS: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASS:-}" ]; then
            echo "::error::The ARTIFACT_PASSPHRASE secret is not set. Add it under" \
                 "Settings > Secrets and variables > Actions > New repository secret," \
                 "then re-run. The patched APK is encrypted with it before upload so" \
                 "nothing usable is ever published; you decrypt the download locally" \
                 "with the same passphrase."
            exit 1
          fi
          echo "Passphrase secret present — proceeding."

      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install objection
        run: pip install objection

      - name: Fetch APKEditor
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o APKEditor.jar \
            "$(gh api repos/REAndroid/APKEditor/releases/latest --jq '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)"
        env:
          GH_TOKEN: ${{ github.token }}

      # The original artifact set (a .7z-split APKMirror .apkm bundle of the
      # real Magic Earth app) already lives in this repo's root — see
      # reports/original-archive-checksums.txt for its recorded hashes.
      - name: Reassemble the original Magic Earth .apkm
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          mkdir -p original
          # 7-Zip's -o output-dir switch MUST be glued to the path (no space).
          # "7z x -o original" -> "Command line error: Too short switch: -o"
          # (exit 7). This was the real cause of the earlier failed runs — it
          # died here, never reaching APKEditor.
          7z x -y -ooriginal CairoDrive.7z.001
          APKM=$(find original -iname '*.apkm' | head -1)
          echo "APKM: $APKM"
          echo "APKM=$APKM" >> "$GITHUB_ENV"

      - name: Merge splits into one installable APK
        run: |
          set -euo pipefail
          # APKEditor's 'm' takes the .apkm bundle DIRECTLY (auto-detected);
          # -i input, -o output, -f force. Single-dash flags only (no GNU --).
          java -jar APKEditor.jar m -i "$APKM" -o merged.apk -f
          ls -la merged.apk

      - name: Install apktool (objection shells out to it)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq apktool

      - name: Embed Frida gadget (search hook, autoload script mode)
        run: |
          set -euo pipefail
          # --skip-resources: Magic Earth is a ~150MB commercial Flutter app;
          # apktool's full resource recompile routinely fails on apps this size.
          # Manifest is still patched (INTERNET perm, extractNativeLibs,
          # loadLibrary), so the gadget still loads. objection re-signs (v2+).
          objection patchapk \
            --source merged.apk \
            --architecture arm64-v8a \
            --gadget-config patch/gadget-config.json \
            -l patch/frida/cairodrive-search-hook.js \
            --skip-resources
          ls -la merged.objection.apk

      - name: Sanity check — confirm this is Magic Earth, re-signed, not a fresh app
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BUILD_TOOLS" ]; then
            PKG=$("$BUILD_TOOLS/aapt2" dump packagename merged.objection.apk || true)
            echo "package: $PKG"
            if [ "$PKG" != "com.generalmagic.magicearth" ]; then
              echo "::warning::package name is '$PKG', expected com.generalmagic.magicearth"
            fi
          fi

      # Encrypt BEFORE upload. The plaintext merged.objection.apk never leaves
      # the runner — only the AES-256 ciphertext is uploaded, so the public
      # artifact is unusable without the owner's passphrase.
      - name: Encrypt the patched APK (AES-256, symmetric)
        env:
          PASS: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --symmetric --cipher-algo AES256 \
              -o magicearth-patched.apk.gpg merged.objection.apk
          rm -f merged.objection.apk merged.apk    # ensure no plaintext is uploaded
          ls -la magicearth-patched.apk.gpg
          sha256sum magicearth-patched.apk.gpg

      - name: Write download + decrypt instructions to the run summary
        run: |
          {
            echo "## Patched Magic Earth — encrypted artifact ready"
            echo ""
            echo "1. Download the artifact **magicearth-patched-encrypted** below."
            echo "2. Decrypt it locally with the passphrase you set as \`ARTIFACT_PASSPHRASE\`:"
            echo ""
            echo '   ```bash'
            echo "   gpg --batch --yes --pinentry-mode loopback --passphrase 'YOUR_PASSPHRASE' \\"
            echo "       --decrypt --output magicearth-patched.apk magicearth-patched.apk.gpg"
            echo '   ```'
            echo ""
            echo "3. Install and run:"
            echo ""
            echo '   ```bash'
            echo "   adb uninstall com.generalmagic.magicearth   # remove Play Store copy first"
            echo "   adb install -r magicearth-patched.apk"
            echo "   adb shell \"echo -n 'YOUR_GOOGLE_PLACES_API_KEY' > /data/local/tmp/gpk\""
            echo "   adb logcat | grep -i cairodrive"
            echo '   ```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: magicearth-patched-encrypted
          path: magicearth-patched.apk.gpg
          if-no-files-found: error
          # Short retention on purpose: personal-use build artifact. Even though
          # it's encrypted, no reason to keep the ciphertext around indefinitely.
          retention-days: 7
