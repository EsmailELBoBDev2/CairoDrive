name: Patch Magic Earth with search hook (Frida gadget)

# Manual trigger ONLY — never on push/PR. This build produces a repackaged,
# re-signed copy of a real third-party commercial app (Magic Earth). It should
# only ever happen when someone deliberately clicks "Run workflow".
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Merge splits, embed gadget, patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install objection
        run: pip install objection

      # The original artifact set (a .7z-split APKMirror .apkm bundle of the
      # real Magic Earth app) already lives in this repo's root — see
      # reports/original-archive-checksums.txt for its recorded hashes.
      #
      # IMPORTANT: the .apkm is a real Android App Bundle split set — base.apk
      # PLUS ~34 config splits (arm64_v8a/armeabi_v7a/x86_64, 7 density
      # buckets, 24 locales). base.apk alone declares
      # android:requiredSplitTypes="base__abi,base__density" in its manifest,
      # so `adb install` on base.apk alone fails with
      # INSTALL_FAILED_MISSING_SPLIT — verified locally against the real
      # archive. All splits must be merged into one APK with no split
      # requirement left in the manifest; APKEditor's `m` command does this
      # (and is purpose-built to read .apkm/.apks/.xapk directly).
      - name: Fetch APKEditor and merge Magic Earth's splits into one installable APK
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

          curl -fSL --retry 5 -o APKEditor.jar \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"
          SIZE=$(stat -c%s APKEditor.jar)
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::APKEditor.jar is too small ($SIZE bytes), download likely failed"
            exit 1
          fi
          if ! file APKEditor.jar | grep -q "Zip"; then
            echo "::error::Downloaded file is not a valid ZIP/JAR: $(file APKEditor.jar)"
            exit 1
          fi
          # NOTE: do NOT gate on the exit code of `-h`/`-help` here. APKEditor
          # prints its help text correctly but always exits 2 on -h, even on
          # success (verified locally) — treating that as failure is what
          # caused earlier CI runs to wrongly conclude the download was
          # corrupt. Size + zip-magic above are the real corruption checks.
          echo "APKEditor v1.4.9 downloaded ($SIZE bytes)"

          mkdir -p original
          # 7-Zip's -o output-dir switch MUST be glued to the path (no space).
          7z x -y -ooriginal CairoDrive.7z.001
          APKM=$(find original -iname '*.apkm' | head -1)
          echo "APKM: $APKM"

          # `m` reads the .apkm directly (no manual unzip needed) and merges
          # every split into one APK, stripping the split-requirement
          # manifest entries in the process.
          java -jar APKEditor.jar m -i "$APKM" -o merged.apk -f
          ls -lh merged.apk

      - name: Install objection's required commands (apktool, adb, zipalign, apksigner)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq apktool adb
          # objection's startup check does a blanket `shutil.which()` presence
          # test on aapt/adb/apksigner/apktool/zipalign before it will run at
          # all (objection/utils/patchers/base.py) — none of these are actually
          # invoked against a device here (we pass --architecture explicitly),
          # they just need to resolve on PATH.
          #
          # zipalign/apksigner ship with the Android SDK build-tools, which
          # ubuntu-latest runners preinstall under $ANDROID_HOME but do NOT put
          # on PATH (only ANDROID_HOME/ANDROID_SDK_ROOT are set) — same reason
          # the sanity-check step below resolves aapt2 by hand instead of
          # calling it bare. Add the newest installed build-tools dir to PATH
          # for the rest of this job.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Embed Frida gadget (search hook, autoload script mode)
        run: |
          set -euo pipefail
          # --skip-resources: Magic Earth is a ~150MB commercial Flutter app;
          # apktool's full resource recompile routinely fails on apps this size.
          # --ignore-nativelibs is REQUIRED alongside --skip-resources (objection
          # refuses to start otherwise): with resources undecoded, objection can't
          # safely re-parse AndroidManifest.xml, so it skips only the
          # extractNativeLibs="false"->"true" manifest tweak. The two steps that
          # actually embed the gadget — injecting the loadLibrary() smali call and
          # copying libfrida-gadget.so into lib/<arch>/ — run unconditionally in
          # objection's source regardless of this flag, so the gadget still loads.
          # INTERNET permission injection also still runs (Magic Earth already
          # declares it, so this is a no-op check, not a manifest rewrite).
          objection patchapk \
            --source merged.apk \
            --architecture arm64-v8a \
            --gadget-config patch/gadget-config.json \
            -l patch/frida/cairodrive-search-hook.js \
            --skip-resources \
            --ignore-nativelibs
          ls -la merged.objection.apk

      - name: Sanity check — confirm this is Magic Earth, re-signed, not a fresh app
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BUILD_TOOLS" ]; then
            PKG=$("$BUILD_TOOLS/aapt2" dump packagename merged.objection.apk || true)
            echo "package: $PKG"
            if [ "$PKG" != "com.generalmagic.magicearth" ]; then
              echo "::warning::package name is '$PKG', expected com.generalmagic.magicearth"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: magicearth-patched
          path: merged.objection.apk
          if-no-files-found: error
          retention-days: 7
