name: Build Android App Bundle (AAB)

on:
  push:
    branches: ["claude/**"]
    paths-ignore: ["**/*.md", "reports/**"]
  pull_request:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, hermetic gate. Runs on every push and needs no secrets at all, so the
  # search layer is verified even on forks.
  search-layer-tests:
    name: Search layer (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        working-directory: packages/cairodrive_search
        run: dart pub get

      - name: Analyze
        working-directory: packages/cairodrive_search
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: packages/cairodrive_search
        run: dart test --reporter expanded

  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    needs: search-layer-tests
    # Job-level env can read `secrets`; a step's own `env:` block is not
    # visible to that step's `if:`, so the presence flag is computed here.
    env:
      HAS_KEYSTORE: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze app
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

      # The keystore only ever exists on disk inside this job, and is removed
      # by the always() cleanup step below.
      - name: Reconstruct signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # No `set -x` anywhere in this job: it would echo secret values.
          # Strip any whitespace/newlines the secret may carry before decoding.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d \
            > "${RUNNER_TEMP}/cairodrive.jks"
          if [ ! -s "${RUNNER_TEMP}/cairodrive.jks" ]; then
            echo "::error::Decoded keystore is empty — check CAIRODRIVE_KEYSTORE_BASE64"
            exit 1
          fi
          # Fail early with a clear message if the alias/password do not match,
          # rather than deep inside the Gradle signing task. keytool prints the
          # store contents, never the password.
          if ! keytool -list -keystore "${RUNNER_TEMP}/cairodrive.jks" \
                 -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore opened but alias '$KEY_ALIAS' or the store password did not match"
            exit 1
          fi
          # key.properties is written outside the workspace-tracked paths and
          # is git-ignored regardless.
          {
            echo "storeFile=${RUNNER_TEMP}/cairodrive.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties
          echo "Keystore reconstructed ($(stat -c%s "${RUNNER_TEMP}/cairodrive.jks") bytes)."

      - name: Build AAB
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          MAGICLANE_API_KEY: ${{ secrets.MAGICLANE_API_KEY }}
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          GRAPHHOPPER_API_KEY: ${{ secrets.GRAPHHOPPER_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          YANDEX_KEY: ${{ secrets.YANDEX_KEY }}
        run: |
          set -euo pipefail
          chmod +x tool/flutter-build.sh
          tool/flutter-build.sh appbundle --${{ inputs.build_type || 'release' }}

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          AAB=$(find app/build/app/outputs/bundle -name '*.aab' | head -1)
          echo "AAB: $AAB"
          # AAB signature verification using bundletool
          if ! command -v bundletool &> /dev/null; then
            # Download bundletool if not available
            wget -q https://github.com/google/bundletool/releases/latest/download/bundletool-all.jar -O /tmp/bundletool.jar
            BUNDLETOOL="/tmp/bundletool.jar"
          else
            BUNDLETOOL="bundletool"
          fi
          echo "Bundletool: $BUNDLETOOL"

      - name: Confirm no secrets leaked into the artifact
        run: |
          set -euo pipefail
          AAB=$(find app/build/app/outputs/bundle -name '*.aab' | head -1)
          # Extract and check for signing material
          if unzip -l "$AAB" | grep -qiE '\.(jks|keystore)$|key\.properties'; then
            echo "::error::Signing material found inside the AAB"
            exit 1
          fi
          echo "No signing material packaged."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: cairodrive-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Generate build info
        if: always()
        run: |
          set -euo pipefail
          AAB=$(find app/build/app/outputs/bundle -name '*.aab' 2>/dev/null || echo "Not found")
          if [ "$AAB" != "Not found" ]; then
            echo "## AAB Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **File**: $(basename "$AAB")" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $(numfmt --to=iec $(stat -c%s "$AAB"))" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Type**: ${{ inputs.build_type || 'release' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact**: cairodrive-aab" >> $GITHUB_STEP_SUMMARY
          fi

      # Runs even when earlier steps fail, so signing material never survives.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/cairodrive.jks" app/android/key.properties
          echo "Temporary signing material removed."
