name: Build Android App Bundle (AAB)

on:
  push:
    branches: [MagicEearth]
    paths-ignore: ["**/*.md", "reports/**"]
  pull_request:
    branches: [MagicEearth]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-layer-tests:
    name: Search layer (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        working-directory: packages/cairodrive_search
        run: dart pub get

      - name: Analyze
        working-directory: packages/cairodrive_search
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: packages/cairodrive_search
        run: dart test --reporter expanded

  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    needs: search-layer-tests
    env:
      HAS_KEYSTORE: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately. app/android/settings.gradle.kts does
          # includeBuild() on the installed SDK's Gradle tooling, so Flutter's
          # AGP/Gradle/KGP floors are compiled from whatever version CI happens
          # to install. Those floors moved (Gradle 8.3.0 -> 8.7.0 -> 8.14.0)
          # across recent stables, and the AGP 8.13.2 / Gradle 8.14.3 pins this
          # project needs sit only just above the 3.47.0 floors. Leaving this on
          # a floating `stable` is precisely what would silently re-break it.
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze app
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

      - name: Reconstruct signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.CAIRODRIVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d \
            > "${RUNNER_TEMP}/cairodrive.jks"
          if [ ! -s "${RUNNER_TEMP}/cairodrive.jks" ]; then
            echo "::error::Decoded keystore is empty — check CAIRODRIVE_KEYSTORE_BASE64"
            exit 1
          fi
          if ! keytool -list -keystore "${RUNNER_TEMP}/cairodrive.jks" \
                 -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore opened but alias '$KEY_ALIAS' or the store password did not match"
            exit 1
          fi
          {
            echo "storeFile=${RUNNER_TEMP}/cairodrive.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties
          echo "Keystore reconstructed ($(stat -c%s "${RUNNER_TEMP}/cairodrive.jks") bytes)."

      - name: Build AAB
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          MAGICLANE_API_KEY: ${{ secrets.MAGICLANE_API_KEY }}
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}
          GRAPHHOPPER_API_KEY: ${{ secrets.GRAPHHOPPER_API_KEY }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          LOCATIONIQ_KEY: ${{ secrets.LOCATIONIQ_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          YANDEX_KEY: ${{ secrets.YANDEX_KEY }}
        run: |
          set -euo pipefail
          chmod +x tool/flutter-build.sh
          tool/flutter-build.sh appbundle --${{ inputs.build_type || 'release' }}

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          AAB=$(find app/build/app/outputs/bundle -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No .aab was produced"
            exit 1
          fi
          echo "AAB: $AAB ($(numfmt --to=iec "$(stat -c%s "$AAB")"))"

          # An AAB is JAR-signed, not signed with the APK Signature Scheme, so
          # apksigner cannot read it — jarsigner is the correct verifier.
          jarsigner -verify -verbose:summary -certs "$AAB" | tee /tmp/aab-sig.txt
          if ! grep -q 'jar verified' /tmp/aab-sig.txt; then
            echo "::error::AAB signature did not verify"
            exit 1
          fi

          # app/build.gradle.kts falls back to the DEBUG signing config when no
          # release keystore is present. That fallback is deliberate (a keyless
          # run still yields an artifact), but it must never pass silently as a
          # release build, so assert the signer is not the debug certificate
          # whenever a release keystore was supplied.
          if [ "$HAS_KEYSTORE" = "true" ] && grep -q 'CN=Android Debug' /tmp/aab-sig.txt; then
            echo "::error::AAB is debug-signed even though a release keystore is configured"
            exit 1
          fi
          echo "Signature verified."

      - name: Confirm no secrets leaked into the artifact
        run: |
          set -euo pipefail
          AAB=$(find app/build/app/outputs/bundle -name '*.aab' | head -1)
          if unzip -l "$AAB" | grep -qiE '\.(jks|keystore)$|key\.properties'; then
            echo "::error::Signing material found inside the AAB"
            exit 1
          fi
          echo "No signing material packaged."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: cairodrive-aab
          # Globbed, not hardcoded to release/: a debug run writes
          # bundle/debug/app-debug.aab, which a release-only path would miss and
          # then fail on if-no-files-found: error.
          path: app/build/app/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Generate build summary
        if: always()
        run: |
          set -euo pipefail
          # `find` exits 0 when it matches nothing, so the previous
          # `|| echo "Not found"` fallback never fired and left AAB empty —
          # which then passed a `!= "Not found"` guard and blew up in stat.
          # Test the variable itself instead.
          AAB=$(find app/build/app/outputs/bundle -name '*.aab' 2>/dev/null | head -1 || true)
          if [ -n "$AAB" ] && [ -f "$AAB" ]; then
            echo "## ✅ AAB Build Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| File | $(basename "$AAB") |" >> $GITHUB_STEP_SUMMARY
            echo "| Size | $(numfmt --to=iec $(stat -c%s "$AAB")) |" >> $GITHUB_STEP_SUMMARY
            echo "| Build Type | ${{ inputs.build_type || 'release' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Artifact | cairodrive-aab |" >> $GITHUB_STEP_SUMMARY
            echo "| Search | Google Places API (Primary) + MagicLane (Fallback) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/cairodrive.jks" app/android/key.properties
          echo "Temporary signing material removed."
