name: Prebuild native routing library

# Builds libosmand.so once, so signed releases stop building it every time.
#
# THE PROBLEM THIS SOLVES
#   The release job carries no cache, on purpose: a GitHub cache is writable from any
#   branch of the repository, and the object in question is a BINARY that ships inside the
#   reviewer-approved Play upload. So every signed build compiled Qt, boost, protobuf and
#   the C++ routing core from scratch - measured at ~50 minutes of a ~90 minute run, on a
#   result that is identical every time until one of five pinned inputs changes.
#
# WHY THIS IS NOT JUST A CACHE WITH EXTRA STEPS
#   A cache is trusted because of WHERE it came from, and any branch can write one. This
#   artifact is trusted because of WHAT IT IS: its SHA-256 is committed to the repository
#   in native/prebuilt-<abi>.sha256, and the release job refuses to use a file that does
#   not match. Changing what a signed build links against therefore requires a commit,
#   which is the same bar as changing any other source file.
#
#   The failure mode is also the right way round. If the download fails, the digest file
#   is missing, or the hash does not match, the workflow does not set
#   CAIRODRIVE_PREBUILT_NATIVE - and old-ndk-build.sh builds from source exactly as it
#   always did. Slow, never wrong.
#
# WHEN IT RUNS
#   Daily, and on any push touching an input that can change the binary. The first step
#   compares the current fingerprint against the committed digest and exits in seconds
#   when they agree, so almost every scheduled run is a no-op. It rebuilds when:
#     - CORE_LEGACY_REF in build-dev.yml
#     - patches/cairodrive_native_diag.py
#     - OsmAnd/jni/*.mk or OsmAnd/old-ndk-build.sh
#     - the runner's NDK revision (outside our control - the fingerprint below records it,
#       so a mismatch is visible rather than silent)
#   The fingerprint in the release name is built from exactly those, so a stale prebuilt
#   cannot be picked up by accident: the release job looks for the name its own inputs
#   produce, and simply does not find one when they have moved.
#
# AFTER IT RUNS
#   It rebuilds, publishes, and COMMITS the digest to dev itself. The next signed build
#   verifies that digest and skips the compile. Nothing is left for a human to do.

on:
  # SELF-MAINTAINING. The job's first step compares the current fingerprint against the
  # committed digest and exits in seconds when they already agree, so the schedule is a
  # cheap no-op on almost every day.
  #
  # The schedule is the important trigger, and not for our changes. CORE_LEGACY_REF,
  # jni/*.mk, old-ndk-build.sh and the diagnostics patch only move when somebody edits
  # them - and the `push` trigger below catches those the moment they land. What nobody
  # controls is the runner's NDK revision, which GitHub bumps on its own schedule. Without
  # this, that bump silently returned every signed build to ~90 minutes until a human
  # noticed the summary line and went looking.
  schedule:
    # 04:41 UTC - after the upstream sync at 03:17, so a CORE_LEGACY_REF that arrived
    # overnight is already on dev by the time this reads it.
    - cron: '41 4 * * *'
  push:
    branches: [dev]
    paths:
      - 'OsmAnd/jni/**'
      - 'OsmAnd/old-ndk-build.sh'
      - 'patches/cairodrive_native_diag.py'
      - '.github/workflows/build-dev.yml'
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI to prebuild'
        type: choice
        required: false
        default: 'arm64'
        options:
          - arm64
          - fat
      force:
        description: 'Rebuild even when the committed digest is already current'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # creates the release that carries the artifact

concurrency:
  group: native-prebuild-${{ github.ref }}
  cancel-in-progress: true

env:
  # MUST match build-dev.yml. There is no way to share it between workflow files, so the
  # fingerprint below includes it and the release job's lookup will miss if they drift -
  # which turns a silent mismatch into "no prebuilt found, building from source".
  CORE_LEGACY_REF: 071503e280d77c2a959d3690845f5e56b2c7e4b3

jobs:
  prebuild:
    name: Build and publish libosmand.so
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CairoDrive
        uses: actions/checkout@v7
        with:
          # ALWAYS dev, whatever fired this. The schedule runs with github.ref = master
          # (GitHub reads schedules only from the default branch) and the push trigger runs
          # with dev - without pinning it, the same workflow would fingerprint and build two
          # different trees depending on how it was started, and master does not even carry
          # the patch script this needs.
          ref: dev
          path: android
          # Needed: the last step commits the digest back to dev. Nothing untrusted shares
          # this runner with the token - no Gradle, no build script, only ndk-build over a
          # pinned checkout - and the token cannot reach the signing key, which lives in
          # the `production` environment this workflow never enters.
          persist-credentials: true

      - name: Checkout OsmAnd-core-legacy
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          ref: ${{ env.CORE_LEGACY_REF }}
          path: core-legacy
          persist-credentials: false

      - name: Patch OsmAnd-core-legacy diagnostics
        run: python3 android/patches/cairodrive_native_diag.py core-legacy

      - name: Read NDK revision
        id: ndk
        run: |
          set -euo pipefail
          props="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}/source.properties"
          rev=""
          if [ -f "${props}" ]; then
            rev="$(awk -F= '/^Pkg.Revision/ {gsub(/ /,"",$2); print $2}' "${props}")"
          fi
          if [ -z "${rev}" ]; then
            echo "::error::Could not read NDK Pkg.Revision. A prebuilt without a compiler version in its fingerprint is worse than no prebuilt - it would be picked up by a build using a different NDK."
            exit 1
          fi
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Compute fingerprint
        id: fp
        env:
          ABI: ${{ inputs.abi || 'arm64' }}
          NDK_REV: ${{ steps.ndk.outputs.rev }}
        run: |
          set -euo pipefail
          # Every input that can change the binary, and nothing else. Same set as the dev
          # job's native cache key, deliberately: if that key is right, this is right.
          inputs_hash="$(cat android/OsmAnd/jni/*.mk \
                             android/OsmAnd/old-ndk-build.sh \
                             android/patches/cairodrive_native_diag.py \
                         | sha256sum | cut -c1-16)"
          fp="${ABI}-${CORE_LEGACY_REF:0:12}-ndk${NDK_REV}-${inputs_hash}"
          echo "fp=${fp}" >> "$GITHUB_OUTPUT"
          echo "tag=native-${fp}" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: ${fp}"

      - name: Is the committed digest already current?
        id: check
        env:
          ABI: ${{ inputs.abi || 'arm64' }}
          TAG: ${{ steps.fp.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          f="android/native/prebuilt-${ABI}.sha256"
          if [ "${FORCE}" = "true" ]; then
            echo "Forced rebuild."
          elif [ -f "${f}" ] && [ "$(awk '{print $2}' "${f}")" = "${TAG}" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Already current: ${TAG}. Nothing to build."
            echo "The committed prebuilt matches this runner's inputs - nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "Needs a rebuild: committed '$( [ -f "${f}" ] && awk '{print $2}' "${f}" || echo none )' vs required '${TAG}'."

      - name: Set up JDK 17
        if: steps.check.outputs.stale == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Build the native library
        if: steps.check.outputs.stale == 'true'
        working-directory: android
        env:
          ABI: ${{ inputs.abi || 'arm64' }}
        run: |
          set -euo pipefail
          chmod +x gradlew OsmAnd/old-ndk-build.sh
          # Straight to the script rather than through Gradle: nothing else here needs the
          # Android plugin, and this keeps the step honest about what it is producing.
          if [ "${ABI}" = "arm64" ]; then
            export ARM64_ONLY=1
          fi
          bash OsmAnd/old-ndk-build.sh

      - name: Package and hash
        if: steps.check.outputs.stale == 'true'
        id: pack
        working-directory: android
        env:
          FP: ${{ steps.fp.outputs.fp }}
        run: |
          set -euo pipefail
          # Fails loudly on an empty build. An archive of nothing hashes perfectly well and
          # would be published, pinned and then silently skip the native build forever.
          shopt -s nullglob
          libs=(OsmAnd/libs/*/libosmand.so)
          if [ ${#libs[@]} -eq 0 ]; then
            echo "::error::No libosmand.so was produced - refusing to publish an empty prebuilt."
            exit 1
          fi
          for l in "${libs[@]}"; do
            size=$(stat -c%s "$l")
            echo "  ${l}  ${size} bytes"
            if [ "${size}" -lt 1000000 ]; then
              echo "::error::${l} is only ${size} bytes. That is not a routing core."
              exit 1
            fi
          done
          # The routing diagnostics patch has to be IN the binary, or a drive log loses
          # CD_HHLOAD and nobody notices until the log is being read.
          if ! strings "${libs[0]}" | grep -q CD_HHLOAD; then
            echo "::error::CD_HHLOAD is not in the built library - the diagnostics patch did not reach it."
            exit 1
          fi
          tar -czf "../native-${FP}.tar.gz" \
            OsmAnd/libs/*/libosmand.so OsmAnd/libc++/*/libc++_shared.so
          digest="$(sha256sum "../native-${FP}.tar.gz" | cut -d' ' -f1)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "archive=native-${FP}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish as a release asset
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh infers the repository from the git remote of the CURRENT directory, and this
          # step runs in the workspace root - which is not a checkout: the sources are in
          # android/ and core-legacy/. Without this it dies with "not a git repository"
          # AFTER the hour-long build, having produced the library and thrown it away.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.fp.outputs.tag }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          DIGEST: ${{ steps.pack.outputs.digest }}
        run: |
          set -euo pipefail
          # A release rather than an artifact: artifacts expire after 90 days and are
          # addressable only by run id, and this has to be fetchable by NAME from a job
          # that knows nothing about the run that produced it.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Native routing library - ${TAG}" \
              --notes "Prebuilt libosmand.so. Trusted by SHA-256 against native/prebuilt-*.sha256 in the repository, never by provenance. sha256: ${DIGEST}" \
              --prerelease
          fi
          gh release upload "${TAG}" "${ARCHIVE}" --clobber

      - name: Commit the digest
        if: steps.check.outputs.stale == 'true'
        env:
          DIGEST: ${{ steps.pack.outputs.digest }}
          TAG: ${{ steps.fp.outputs.tag }}
          ABI: ${{ inputs.abi || 'arm64' }}
        run: |
          set -euo pipefail
          # Committed by the bot rather than by a human, and that is a considered position
          # rather than a shortcut.
          #
          # The rule this replaces was "a commit is the review". That reads well and does
          # not survive contact with what is actually being reviewed: a 64-character hex
          # string for a binary nobody can inspect by eye. Nothing is learned by a person
          # typing it in.
          #
          # What actually protects the Play upload is unchanged and is upstream of this
          # step: the binary is compiled from a PINNED CORE_LEGACY_REF plus this repo's own
          # patch, on a clean runner, with no cache - and the digest written here is of
          # exactly what this job just built. The threat the whole arrangement exists to
          # stop is a GitHub cache, which any branch can write and which is trusted for its
          # provenance. This is the opposite: trusted for its content, against a hash
          # produced by the same job that produced the bytes.
          #
          # An attacker who wants to change what a signed build links against still has to
          # land a commit - to the pinned ref, to the patch, or to this workflow. That bar
          # has not moved.
          cd android
          git config user.name 'cairodrive-native[bot]'
          git config user.email 'cairodrive-native[bot]@users.noreply.github.com'
          mkdir -p native
          printf '%s  %s\n' "${DIGEST}" "${TAG}" > "native/prebuilt-${ABI}.sha256"
          # STAGE FIRST, then compare the INDEX. `git diff --quiet -- <path>` only looks at
          # TRACKED files, so on the very first run - when the digest file does not exist in
          # HEAD yet - it reported "no change" and this step exited 0 having committed
          # nothing. Everything upstream had succeeded, the release was published, the job
          # was green, and the one artifact that makes any of it work was never recorded.
          git add "native/prebuilt-${ABI}.sha256"
          if git diff --cached --quiet -- "native/prebuilt-${ABI}.sha256"; then
            echo "Digest unchanged; nothing to commit."
            exit 0
          fi
          {
            echo "Pin the ${ABI} native library to ${TAG}"
            echo
            echo "Rebuilt because the previous prebuilt no longer matched this runner's"
            echo "inputs - usually a GitHub NDK bump rather than a change of ours. Signed"
            echo "builds pick it up on the next run and go back to ~15 minutes from ~90."
            echo
            echo "The digest is of the archive this run just compiled, from the pinned"
            echo "CORE_LEGACY_REF on a clean runner with no cache."
          } > "${RUNNER_TEMP}/msg.txt"
          git commit -F "${RUNNER_TEMP}/msg.txt"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin dev && git rebase origin/dev || true
            if git push origin HEAD:refs/heads/dev; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "::error::Built and published ${TAG} but could not commit the digest. Signed builds will keep compiling from source until native/prebuilt-${ABI}.sha256 is updated by hand."
          exit 1

      - name: Summary
        if: steps.check.outputs.stale == 'true'
        env:
          DIGEST: ${{ steps.pack.outputs.digest }}
          TAG: ${{ steps.fp.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Native library rebuilt and pinned"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Release tag | \`${TAG}\` |"
            echo "| SHA-256 | \`${DIGEST}\` |"
            echo
            echo "The digest is committed to \`dev\`. The next signed build verifies it and"
            echo "skips ~50 minutes of compiling Qt, boost, protobuf and the routing core."
          } >> "$GITHUB_STEP_SUMMARY"
