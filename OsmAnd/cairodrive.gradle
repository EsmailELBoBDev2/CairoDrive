// CairoDrive fork configuration.
//
// Everything specific to this fork lives here instead of being spread across the
// upstream build files, so that automated syncs with osmandapp/OsmAnd stay
// conflict free. build.gradle only carries a single `apply from` line.
//
// Environment variables understood by this script:
//   CAIRODRIVE_KEYSTORE_FILE     - path to the release keystore. Overrides the
//                                  Jenkins-only path upstream hardcodes in the
//                                  `publishing` signing config.
//   CAIRODRIVE_KEYSTORE_PASSWORD - keystore password
//   CAIRODRIVE_KEY_ALIAS         - key alias
//   CAIRODRIVE_KEY_PASSWORD      - key password
//                                  Each of the four is also read under its ANDROID_*
//                                  name (ANDROID_KEYSTORE_PASSWORD and so on), which is
//                                  how they are stored as repository secrets. All four
//                                  must be present: a keystore without its credentials
//                                  falls back to the debug keystore.
//   CAIRODRIVE_FULL_LOGGING      - "true"/"false", forces the verbose on-device
//                                  logger on or off for every build type.
//                                  Defaults to on for debug, off for release.
//   GOOGLE_PLACES_API_KEY        - key for the Google Places API (New). When set, place
//                                  search is served by Google instead of the offline OSM
//                                  index; when empty the build behaves like stock OsmAnd.
//   CAIRODRIVE_DATA_SAVER        - "true"/"false", whether bulk transfers stay off a
//                                  metered connection by default. Defaults to on.

// The Pro tier without a subscription - weather, OsmAnd Cloud, 3D/terrain, Pro widgets,
// route colouring - matching what upstream already grants any build that Version.isDeveloperBuild
// accepts, which is how OsmAnd~ on F-Droid ships. See CairoDriveFeatures. Set
// CAIRODRIVE_UNLOCK_PRO=false to build stock behaviour instead.
def unlockPro = System.getenv("CAIRODRIVE_UNLOCK_PRO")
def proUnlocked = unlockPro?.trim() ? unlockPro.trim() : "true"

// Start navigating on the vehicle arrow, close in and tilted, instead of on a zoomed-out
// view of the whole route. See CairoDriveNavigationView.
//
// ON as of the owner's report that the map starts flat and top-down rather than at ground
// level the way Google Maps and Waze do. That is not a missing feature, it is a chicken-and-egg
// in upstream: MapViewTrackingUtilities only applies AUTO_ZOOM_3D_ANGLE when the map is ALREADY
// tilted (`getElevationAngle() != DEFAULT_ELEVATION_ANGLE`), and DEFAULT is 90 - flat. Anyone
// who has never tilted the map by hand therefore never gets the 3D view, no matter what the
// setting says. The car profile's AUTO_ZOOM_3D_ANGLE has defaulted to 40 the whole time and
// never once fired. This substitutes it when the stored angle is flat.
//
// It also stops a mid-drive recalculation yanking the head unit back to the whole-route view,
// which additionally resets rotation to north and the camera to flat.
//
// Was off pending evidence, on the theory that changing the camera at the moment navigation
// starts might be the reported stutter. That was precaution, not measurement. The honest risk
// is the opposite one and it is worth watching for: a tilted camera sees FURTHER, so more tiles
// are in frame and every frame draws more. If CD_FRAME's `over` bucket or avgMs is worse on the
// drive that follows this, that is why - set CAIRODRIVE_DRIVING_VIEW=false and it is back to
// flat.
def drivingViewEnv = System.getenv("CAIRODRIVE_DRIVING_VIEW")
def drivingView = drivingViewEnv?.trim() ? drivingViewEnv.trim() : "true"

// Require corroboration from several fixes before a deviation costs a route recalculation.
// See CairoDriveOffRoute.
// OFF by default as of the first real drive. The hysteresis was meant to stop one bad fix
// under a flyover costing a full recomputation; what it actually did on the road was delay a
// genuine wrong turn for kilometres. Three of its rules compound: a single fix reading
// on-route resets the counter to zero, so a wrong turn onto a road running near the route
// never accumulates evidence; a fix with accuracy over 100 m is dropped without counting; and
// the 50 m / 3 s debounce is checked before the counter advances, not after. Together they can
// suppress a reroute indefinitely, which is far worse than the spurious reroute they prevent -
// a driver who has gone the wrong way needs to be told immediately.
// ON again as of 2026-08-04, after all three of those rules were fixed and a hard 12 s timeout
// was added as a backstop. The 2026-08-04 drive produced exactly the failure this exists to
// prevent - reroute after reroute after reroute while trying to turn around - so the cost of
// leaving it off is now observed rather than theoretical. Evidence is cleared by two consecutive
// ON-route fixes rather than one, the debounce is checked after the evidence test rather than
// before, and no combination of rules can now delay a genuine reroute past 12 s. Six fix patterns
// were simulated against the new logic before this default was flipped.
def offRouteEnv = System.getenv("CAIRODRIVE_OFFROUTE_HYSTERESIS")
def offRouteHysteresis = offRouteEnv?.trim() ? offRouteEnv.trim() : "true"

// How much WIDER than the head unit's screen the offscreen map is rendered, as a fraction.
// Upstream uses 0.5 - half a screen of extra width, rendered every frame and then cropped.
//
// It buys one thing: when the Android Auto card panel changes size, the visible window can
// slide across the already-rendered image without asking the map core to re-render. It costs
// that on every single frame, in the most expensive part of the Android Auto pipeline - the
// map is read back from the GPU into a Bitmap and then blitted onto the head unit's canvas,
// and at 0.5 both of those copies move 50% more pixels than are ever displayed. On a 1920-wide
// head unit that is 2880x1080 read and copied per frame to show 1920x1080.
//
// Zero is not an untested path: the shift is also implemented in the camera itself
// (cameraCenterShiftX in SurfaceRenderer.changeVisibleArea), and that is the branch the
// non-OpenGL renderer has always used. Set CAIRODRIVE_SURFACE_OVERSCAN=0.5 to restore
// upstream behaviour if the panel transition looks wrong on a real head unit.
def overscanEnv = System.getenv("CAIRODRIVE_SURFACE_OVERSCAN")
def surfaceOverscan = overscanEnv?.trim() ? overscanEnv.trim() : "0.0"

// Fraction of the head unit's resolution the map is rendered at, before being upscaled onto
// the car canvas. 1.0 renders at native size - upstream behaviour and the default here.
//
// This is the cheap lever on the two most expensive steps of an Android Auto frame. Every
// frame the map is read back from the GPU into a Bitmap and then blitted onto the head unit's
// canvas with a SOFTWARE blit - a lockCanvas canvas is never hardware accelerated - and both
// copies scale with pixel count, not with scene complexity. At 0.75 they each move 44% fewer
// pixels; at 0.85, 28% fewer.
//
// Back to 1.0 - full sharpness. It was set to 0.75 and reverted before ever being driven, once
// it was clear the right fix is to remove the two copies entirely rather than shrink them:
// render into the car Surface through a VirtualDisplay, which is what Google documents and what
// every other navigation app does. Trading sharpness is the discount version of that.
//
// The mechanism stays wired and costs nothing at 1.0 (SurfaceRenderer skips the stretched blit
// entirely on that path). Set CAIRODRIVE_RENDER_SCALE=0.85 or 0.75 if the direct-render route
// does not pan out and frame rate has to be bought with sharpness after all.
//
// The value is recorded in every CD_FRAME summary line and in the SESSION flags line, so a log
// always says which setting produced it.
//
// The real fix is not to copy at all - render into the car Surface through a VirtualDisplay,
// which needs no core change - but that needs proving on a real head unit first. This is the
// thing worth having in the meantime, and the fallback if that does not pan out.
// Draw the car frame with a HARDWARE canvas instead of the software one.
//
// surface.lockCanvas() is never hardware accelerated - that is AOSP's documented behaviour, not a
// quirk - so the per-frame blit runs on the CPU through Skia. The 2026-08-04 drive measured that
// blit at 9.2 ms, 22% of a 46.9 ms frame, second only to OsmAnd's own overlay drawing.
// lockHardwareCanvas() moves it to the GPU and is a five-line change against what would otherwise
// be a multi-day rewrite.
//
// OFF by default because the head unit, not this app, allocates the buffer, and if it lacks the
// GPU usage flags the hardware path needs the lock fails outright. SurfaceRenderer falls back to
// the software canvas and latches that decision for the session, so the failure mode is "no
// improvement", never a black screen - but it should still be proven on a real drive before it
// becomes the default.
def hwCanvasEnv = System.getenv("CAIRODRIVE_HW_CANVAS")
def hwCanvas = hwCanvasEnv?.trim() ? hwCanvasEnv.trim() : "false"

def renderScaleEnv = System.getenv("CAIRODRIVE_RENDER_SCALE")
def renderScale = renderScaleEnv?.trim() ? renderScaleEnv.trim() : "1.0"

// Keep bulk transfers off a metered connection unless the user asks for them explicitly.
// This fork is driven on Egyptian mobile data, where an unattended download is a bill rather
// than an inconvenience, and CAIRODRIVE_UNLOCK_PRO hands the user features - weather most of
// all - that fetch tiles on their own. See CairoDriveDataSaver.
def dataSaverEnv = System.getenv("CAIRODRIVE_DATA_SAVER")
def dataSaver = dataSaverEnv?.trim() ? dataSaverEnv.trim() : "true"

// On by default for BOTH build types now. The release build is what gets installed from
// Play, which Android Auto requires, and this fork's release track is internal testing with
// one user - so the signed build has to log too, or a head-unit drive produces nothing.
// Set CAIRODRIVE_FULL_LOGGING=false at build time before any *public* production release: a
// build that continuously records GPS to storage needs a privacy disclosure on a public
// listing. The logs live in app-scoped external storage (Android/data), auto-deleted on
// uninstall - see CairoDriveLogger.resolveLogDirectory.
def fullLogging = System.getenv("CAIRODRIVE_FULL_LOGGING")
def debugLogging = fullLogging?.trim() ? fullLogging.trim() : "true"
def releaseLogging = fullLogging?.trim() ? fullLogging.trim() : "true"

// Escaped and quoted because buildConfigField takes a Java literal, not a bare string.
def placesKey = System.getenv("GOOGLE_PLACES_API_KEY")?.trim() ?: ""
def placesKeyLiteral = "\"" + placesKey.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
if (placesKey) {
	logger.lifecycle("CairoDrive: Google Places search enabled (key supplied via GOOGLE_PLACES_API_KEY)")
} else {
	logger.lifecycle("CairoDrive: GOOGLE_PLACES_API_KEY not set, falling back to offline OSM search")
}

android {
	sourceSets {
		// Same source set composition as nightlyFree: the Google in-app purchase
		// implementation plus the self-updating "OsmAnd~" contribution screens.
		cairodrive {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-cairodrive.xml"
		}
	}

	productFlavors {
		cairodrive {
			dimension "version"
			applicationId "com.cairodrive.app"
			resValue "string", "app_name", "CairoDrive"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""

			// Ship two languages instead of 117. res/values-*/ is 41 MB of translations and
			// ALL of it lands in every install, because upstream disables Play's language
			// splitting (build.gradle: bundle { language { enableSplit = false } }) - and that
			// is correct, not an oversight: OsmAnd has an in-app language selector independent
			// of the system locale, so a split would leave a chosen-but-not-installed language
			// showing untranslated text.
			//
			// resConfigs solves the same problem from the other end and without that hazard: the
			// languages are dropped at BUILD time, so the selector only ever offers what is
			// actually present. This is an Egypt-focused fork with an Arabic-speaking user base,
			// so English and Arabic is the honest list. Add a code here to bring one back.
			//
			// Deliberately NOT paired with shrinkResources. That one is genuinely dangerous
			// here: this app resolves resources by name at runtime via getIdentifier in 20
			// places, R8 cannot see those references, and it would strip icons and rendering
			// styles that are very much in use. Upstream leaves it off for the same reason.
			resConfigs "en", "ar"
		}
	}

	buildTypes {
		debug {
			buildConfigField "boolean", "CAIRODRIVE_FULL_LOGGING", debugLogging
			buildConfigField "String", "GOOGLE_PLACES_API_KEY", placesKeyLiteral
			buildConfigField "boolean", "CAIRODRIVE_UNLOCK_PRO", proUnlocked
			buildConfigField "boolean", "CAIRODRIVE_DRIVING_VIEW", drivingView
			buildConfigField "boolean", "CAIRODRIVE_OFFROUTE_HYSTERESIS", offRouteHysteresis
			buildConfigField "boolean", "CAIRODRIVE_DATA_SAVER", dataSaver
			buildConfigField "float", "CAIRODRIVE_SURFACE_OVERSCAN", surfaceOverscan + "f"
			buildConfigField "float", "CAIRODRIVE_RENDER_SCALE", renderScale + "f"
			buildConfigField "boolean", "CAIRODRIVE_HW_CANVAS", hwCanvas
		}
		release {
			buildConfigField "boolean", "CAIRODRIVE_FULL_LOGGING", releaseLogging
			buildConfigField "String", "GOOGLE_PLACES_API_KEY", placesKeyLiteral
			buildConfigField "boolean", "CAIRODRIVE_UNLOCK_PRO", proUnlocked
			buildConfigField "boolean", "CAIRODRIVE_DRIVING_VIEW", drivingView
			buildConfigField "boolean", "CAIRODRIVE_OFFROUTE_HYSTERESIS", offRouteHysteresis
			buildConfigField "boolean", "CAIRODRIVE_DATA_SAVER", dataSaver
			buildConfigField "float", "CAIRODRIVE_SURFACE_OVERSCAN", surfaceOverscan + "f"
			buildConfigField "float", "CAIRODRIVE_RENDER_SCALE", renderScale + "f"
			buildConfigField "boolean", "CAIRODRIVE_HW_CANVAS", hwCanvas
		}
	}
}

// The upstream `publishing` signing config points at /var/lib/jenkins/osmand_key,
// which does not exist outside of OsmAnd's own build server. Repoint it at the
// keystore supplied through the environment, or - when none is supplied - at the
// checked-in debug keystore so that `assembleRelease`/`bundleRelease` still
// produce installable artifacts. Debug-signed bundles cannot be uploaded to
// Google Play; the CI workflow says so explicitly in its build summary.
// Each credential is read under either spelling, so a local build can export the same
// ANDROID_* names the repository secrets use instead of duplicating them.
def credential = { String preferred, String fallback ->
	def value = System.getenv(preferred)
	value?.trim() ? value : System.getenv(fallback)
}

def keystorePath = credential("CAIRODRIVE_KEYSTORE_FILE", "ANDROID_KEYSTORE_FILE")?.trim()
def storePassword = credential("CAIRODRIVE_KEYSTORE_PASSWORD", "ANDROID_KEYSTORE_PASSWORD")
def keyAlias = credential("CAIRODRIVE_KEY_ALIAS", "ANDROID_KEY_ALIAS")
def keyPassword = credential("CAIRODRIVE_KEY_PASSWORD", "ANDROID_KEY_PASSWORD")

// A keystore is only usable with all three credentials. Checking them here rather than
// letting a null password reach the signer matters: signing is the very last task of the
// bundle, so an incomplete set otherwise costs a full compile before failing with a
// BadPaddingException that says nothing about which secret is missing.
def missingCredentials = []
if (!storePassword?.trim()) missingCredentials << "ANDROID_KEYSTORE_PASSWORD"
if (!keyAlias?.trim()) missingCredentials << "ANDROID_KEY_ALIAS"
if (!keyPassword?.trim()) missingCredentials << "ANDROID_KEY_PASSWORD"

def publishing = android.signingConfigs.publishing
if (keystorePath && file(keystorePath).exists() && missingCredentials.isEmpty()) {
	publishing.storeFile = file(keystorePath)
	publishing.storePassword = storePassword
	publishing.keyAlias = keyAlias
	publishing.keyPassword = keyPassword
	logger.lifecycle("CairoDrive: release artifacts signed with ${keystorePath}")
} else {
	if (keystorePath && file(keystorePath).exists()) {
		// Warn rather than fail: a green build with installable debug-signed artifacts is
		// more use than no artifacts at all, and Google Play rejects the bundle anyway.
		logger.warn("CairoDrive: a release keystore was supplied but "
				+ missingCredentials.join(", ") + (missingCredentials.size() == 1 ? " is" : " are")
				+ " missing, so the debug keystore is used instead.")
	} else {
		logger.lifecycle("CairoDrive: no release keystore configured, using the debug keystore.")
	}
	publishing.storeFile = file("../keystores/debug.keystore")
	publishing.storePassword = "android"
	publishing.keyAlias = "androiddebugkey"
	publishing.keyPassword = "android"
	logger.lifecycle("CairoDrive: artifacts are installable but NOT uploadable to Google Play.")
}
