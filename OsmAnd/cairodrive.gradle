// CairoDrive fork configuration.
//
// Everything specific to this fork lives here instead of being spread across the
// upstream build files, so that automated syncs with osmandapp/OsmAnd stay
// conflict free. build.gradle only carries a single `apply from` line.
//
// Environment variables understood by this script:
//   CAIRODRIVE_KEYSTORE_FILE     - path to the release keystore. Overrides the
//                                  Jenkins-only path upstream hardcodes in the
//                                  `publishing` signing config.
//   CAIRODRIVE_KEYSTORE_PASSWORD - keystore password
//   CAIRODRIVE_KEY_ALIAS         - key alias
//   CAIRODRIVE_KEY_PASSWORD      - key password
//                                  Each of the four is also read under its ANDROID_*
//                                  name (ANDROID_KEYSTORE_PASSWORD and so on), which is
//                                  how they are stored as repository secrets. All four
//                                  must be present: a keystore without its credentials
//                                  falls back to the debug keystore.
//   CAIRODRIVE_FULL_LOGGING      - "true"/"false", forces the verbose on-device
//                                  logger on or off for every build type.
//                                  Defaults to on for debug, off for release.
//   GOOGLE_PLACES_API_KEY        - key for the Google Places API (New). When set, place
//                                  search is served by Google instead of the offline OSM
//                                  index; when empty the build behaves like stock OsmAnd.
//   CAIRODRIVE_DATA_SAVER        - "true"/"false", whether bulk transfers stay off a
//                                  metered connection by default. Defaults to on.

// The Pro tier without a subscription - weather, OsmAnd Cloud, 3D/terrain, Pro widgets,
// route colouring - matching what upstream already grants any build that Version.isDeveloperBuild
// accepts, which is how OsmAnd~ on F-Droid ships. See CairoDriveFeatures. Set
// CAIRODRIVE_UNLOCK_PRO=false to build stock behaviour instead.
def unlockPro = System.getenv("CAIRODRIVE_UNLOCK_PRO")
def proUnlocked = unlockPro?.trim() ? unlockPro.trim() : "true"

// Start navigating on the vehicle arrow, close in and tilted, instead of on a zoomed-out
// view of the whole route. See CairoDriveNavigationView.
//
// ON as of the owner's report that the map starts flat and top-down rather than at ground
// level the way Google Maps and Waze do. That is not a missing feature, it is a chicken-and-egg
// in upstream: MapViewTrackingUtilities only applies AUTO_ZOOM_3D_ANGLE when the map is ALREADY
// tilted (`getElevationAngle() != DEFAULT_ELEVATION_ANGLE`), and DEFAULT is 90 - flat. Anyone
// who has never tilted the map by hand therefore never gets the 3D view, no matter what the
// setting says. The car profile's AUTO_ZOOM_3D_ANGLE has defaulted to 40 the whole time and
// never once fired. This substitutes it when the stored angle is flat.
//
// It also stops a mid-drive recalculation yanking the head unit back to the whole-route view,
// which additionally resets rotation to north and the camera to flat.
//
// Was off pending evidence, on the theory that changing the camera at the moment navigation
// starts might be the reported stutter. That was precaution, not measurement. The honest risk
// is the opposite one and it is worth watching for: a tilted camera sees FURTHER, so more tiles
// are in frame and every frame draws more. If CD_FRAME's `over` bucket or avgMs is worse on the
// drive that follows this, that is why - set CAIRODRIVE_DRIVING_VIEW=false and it is back to
// flat.
def drivingViewEnv = System.getenv("CAIRODRIVE_DRIVING_VIEW")
def drivingView = drivingViewEnv?.trim() ? drivingViewEnv.trim() : "true"

// Require corroboration from several fixes before a deviation costs a route recalculation.
// See CairoDriveOffRoute.
// OFF by default as of the first real drive. The hysteresis was meant to stop one bad fix
// under a flyover costing a full recomputation; what it actually did on the road was delay a
// genuine wrong turn for kilometres. Three of its rules compound: a single fix reading
// on-route resets the counter to zero, so a wrong turn onto a road running near the route
// never accumulates evidence; a fix with accuracy over 100 m is dropped without counting; and
// the 50 m / 3 s debounce is checked before the counter advances, not after. Together they can
// suppress a reroute indefinitely, which is far worse than the spurious reroute they prevent -
// a driver who has gone the wrong way needs to be told immediately.
// ON again as of 2026-08-04, after all three of those rules were fixed and a hard 12 s timeout
// was added as a backstop. The 2026-08-04 drive produced exactly the failure this exists to
// prevent - reroute after reroute after reroute while trying to turn around - so the cost of
// leaving it off is now observed rather than theoretical. Evidence is cleared by two consecutive
// ON-route fixes rather than one, the debounce is checked after the evidence test rather than
// before, and no combination of rules can now delay a genuine reroute past 12 s. Six fix patterns
// were simulated against the new logic before this default was flipped.
def offRouteEnv = System.getenv("CAIRODRIVE_OFFROUTE_HYSTERESIS")
def offRouteHysteresis = offRouteEnv?.trim() ? offRouteEnv.trim() : "true"

// How much WIDER than the head unit's screen the offscreen map is rendered, as a fraction.
// Upstream uses 0.5 - half a screen of extra width, rendered every frame and then cropped.
//
// It buys one thing: when the Android Auto card panel changes size, the visible window can
// slide across the already-rendered image without asking the map core to re-render. It costs
// that on every single frame, in the most expensive part of the Android Auto pipeline - the
// map is read back from the GPU into a Bitmap and then blitted onto the head unit's canvas,
// and at 0.5 both of those copies move 50% more pixels than are ever displayed. On a 1920-wide
// head unit that is 2880x1080 read and copied per frame to show 1920x1080.
//
// Zero is not an untested path: the shift is also implemented in the camera itself
// (cameraCenterShiftX in SurfaceRenderer.changeVisibleArea), and that is the branch the
// non-OpenGL renderer has always used. Set CAIRODRIVE_SURFACE_OVERSCAN=0.5 to restore
// upstream behaviour if the panel transition looks wrong on a real head unit.
def overscanEnv = System.getenv("CAIRODRIVE_SURFACE_OVERSCAN")
def surfaceOverscan = overscanEnv?.trim() ? overscanEnv.trim() : "0.0"

// Fraction of the head unit's resolution the map is rendered at, before being upscaled onto
// the car canvas. 1.0 renders at native size - upstream behaviour and the default here.
//
// This is the cheap lever on the two most expensive steps of an Android Auto frame. Every
// frame the map is read back from the GPU into a Bitmap and then blitted onto the head unit's
// canvas with a SOFTWARE blit - a lockCanvas canvas is never hardware accelerated - and both
// copies scale with pixel count, not with scene complexity. At 0.75 they each move 44% fewer
// pixels; at 0.85, 28% fewer.
//
// Back to 1.0 - full sharpness. It was set to 0.75 and reverted before ever being driven, once
// it was clear the right fix is to remove the two copies entirely rather than shrink them:
// render into the car Surface through a VirtualDisplay, which is what Google documents and what
// every other navigation app does. Trading sharpness is the discount version of that.
//
// The mechanism stays wired and costs nothing at 1.0 (SurfaceRenderer skips the stretched blit
// entirely on that path). Set CAIRODRIVE_RENDER_SCALE=0.85 or 0.75 if the direct-render route
// does not pan out and frame rate has to be bought with sharpness after all.
//
// The value is recorded in every CD_FRAME summary line and in the SESSION flags line, so a log
// always says which setting produced it.
//
// The real fix is not to copy at all - render into the car Surface through a VirtualDisplay,
// which needs no core change - but that needs proving on a real head unit first. This is the
// thing worth having in the meantime, and the fallback if that does not pan out.
// Draw the car frame with a HARDWARE canvas instead of the software one.
//
// surface.lockCanvas() is never hardware accelerated - that is AOSP's documented behaviour, not a
// quirk - so everything drawn into that canvas runs on the CPU through Skia.
//
// This was first written as a fix for `blit` alone (9.2 ms, 22% of the 46.9 ms frame). That
// undersold it. The SAME canvas is what mapView.drawOverMap() draws into, and drawOverMap IS the
// `over` bucket - 25.9 ms, 61% of the frame, the single largest cost this app has. So the software
// canvas is not paying for one of the six buckets, it is paying for two, together 76% of a frame:
//
//     blit 9.2 (22%)  +  over 25.9 (61%)  =  35.1 ms of 46.9
//
// That also makes this the cheap experiment that DECIDES the VirtualDisplay rewrite (B1). B1's
// whole premise is that moving the car frame onto a hardware-accelerated pipeline is worth 3-5
// days. This flag tests that premise in one drive. If `over` falls, the premise holds and B1 is
// worth scheduling; if `over` does not move, `over` is genuine Java geometry work, B1 would not
// have helped either, and the money goes to CD_LAYER's named offenders instead.
//
// ON by default as of the next build, so the drive produces the comparison. It is not a blind
// flip: the two preconditions lockHardwareCanvas needs are already satisfied here (the surface is
// fully repainted every frame, and no GLES surface is ever attached to it), and the failure mode
// is bounded - the head unit, not this app, allocates the buffer, so if it lacks the GPU usage
// flags the lock fails outright, SurfaceRenderer falls back to the software canvas and LATCHES
// that decision for the session. Worst case is "no improvement", never a black screen.
//
// What to actually check on the log: `over` and `blit` in CD_FRAME against 25.9 / 9.2, and
// hwCanvas= in the SESSION line to confirm it did not latch back to software. What to check on
// the SCREEN: a hardware canvas does not accept every Canvas operation a software one does, so
// look for a missing or wrongly-drawn overlay - the route line, the arrow, the speed limit sign.
// Set CAIRODRIVE_HW_CANVAS=false to build without it.
def hwCanvasEnv = System.getenv("CAIRODRIVE_HW_CANVAS")
def hwCanvas = hwCanvasEnv?.trim() ? hwCanvasEnv.trim() : "true"

// Draw the Android Auto map through a VirtualDisplay + Presentation instead of rendering offscreen
// and copying the result onto the car surface every frame. This is "B1".
//
// The offscreen path does three copies per frame - render offscreen, read the pixels back out of
// the GPU, blit them onto a lockCanvas() canvas - and then draws every overlay onto that same
// software canvas. The 2026-08-04 drive priced it over 32,200 frames:
//
//     over 25.9ms (61%) | blit 9.2 (22%) | read 4.5 (11%) | lock 1.6 | post 1.0 | wdgt 0.1
//
// A Presentation on a virtual display backed by the car's own Surface removes all three copies at
// once, because none of them is a step in the ordinary Android view pipeline - and it carries the
// overlays onto the GPU with it, because OsmAndMapLayersView is a plain View. It is not a new
// architecture: it is the SAME view stack the phone already uses (MapViewWithLayers = an
// AtlasMapRendererView with an OsmAndMapLayersView on top), pointed at a different display.
//
// ON by default, because the point is to measure it, and because the fallback is real rather than
// theoretical: CairoDriveCarPresentation.attach() wraps every step in try/catch, returns false on
// any failure with the reason logged as CD_PRESENT, releases everything it created, and
// SurfaceRenderer then builds the offscreen renderer exactly as it does today. The failure latches
// for the session rather than retrying, since rebuilding a GL context mid-drive on a head unit
// that has already refused one is worse than the frame cost being avoided.
//
// Needs no permission: the display is created OWN_CONTENT_ONLY, so it is private, so the window is
// typed TYPE_PRIVATE_PRESENTATION, which PhoneWindowManager admits without SYSTEM_ALERT_WINDOW.
//
// CAIRODRIVE_SURFACE_OVERSCAN and CAIRODRIVE_RENDER_SCALE do not apply on this path and are not
// read by it. Both exist only to move fewer pixels through the readback and the blit.
//
// What to check on the log: CD_PRESENT says `attached` or `FAILED <reason>`; CD_FRAME then carries
// `renderMode=presentation` with `avgOver` against 25.9 and `avgMs` against 46.9, plus `hwAccel=`,
// which must be true - false would mean the window fell back to software and the overlays are
// still on the CPU. What to check on the SCREEN: that the map appears at all, and that touch,
// panning and zoom still work from the head unit.
// Set CAIRODRIVE_PRESENTATION=false to build the offscreen path.
// Refuse osmand.api:// READ commands from other apps.
//
// osmand.api:// is an EXPORTED intent filter, so any app on the phone can call it having asked
// the user for no permission of its own. get_info answers with the current GPS position, the map
// centre, the navigation destination, the ETA, the remaining distance, the upcoming turns and the
// recorded routing analytics - a live location feed, and a way around the location permission the
// user granted to THIS app and not to that one.
//
// Only the read commands are gated (get_info, get_quick_action_info, subscribe_voice_notifications).
// Showing a point, adding a favourite and starting navigation stay open: those are visible to the
// user when they happen, and they are why the API exists.
//
// The check is getCallingActivity(), which the system fills in and an intent cannot forge. A null
// caller is allowed - it means startActivity rather than startActivityForResult, so there is
// nowhere for a result to go anyway.
//
// A refusal is logged as CD_SEC with the calling package, so a legitimate integration that breaks
// says exactly what to allowlist instead of failing mysteriously.
// Ask the HH engine for alternative routes alongside the main one. Item 7.
//
// The implementation is complete and already in the tree (HHRoutingConfig.calcAlternative,
// HHRoutePlanner.calcAlternativeRoute); upstream simply never enables it. It is worth trying
// because HHRoutingConfig is handed STRAIGHT into the JNI call, so alternatives may fall out of
// the SAME search at marginal cost rather than costing a second one - and Google's own docs say
// alternative routes are not available offline, so this is a place a personal offline fork can
// actually be ahead rather than catching up.
//
// OFF by default, deliberately. The cost is unmeasured and it lands on the search path - the
// exact path the next drive exists to measure for B1, the repair probe and pre=. Adding an
// unmeasured cost to the thing being measured is how a drive produces numbers nobody can read.
// Flip it for the drive AFTER this one. CD_ROUTE_TIMING reports alt= either way.
def routeAlternativesEnv = System.getenv("CAIRODRIVE_ROUTE_ALTERNATIVES")
def routeAlternatives = routeAlternativesEnv?.trim() ? routeAlternativesEnv.trim() : "false"

// Item 7, resolved. Instead of holding alternatives on or off for a whole drive - which leaves no
// baseline to compare `search` against except a different drive on different roads in different
// traffic - ALTERNATE them per calculation. One drive then contains both arms, minutes apart, on
// the same roads, and every CD_ROUTE_TIMING line carries its own alt= so the two are separable.
//
// This is what makes item 7 shippable in the same drive as B1 and the repair probe rather than
// waiting for a drive of its own: the confound was never the feature, it was holding the setting
// constant. Safe to vary per call because it is an INPUT to the search and not state - the config
// object is rebuilt every time and nothing caches across calls.
//
// Set CAIRODRIVE_ROUTE_ALTERNATIVES=true to force it on for every calculation instead, or
// CAIRODRIVE_ALTERNATE_ALTERNATIVES=false to switch the A/B off entirely.
// ITEM 4, LIVE. On a deviation, route only as far as a rejoin point on the previous route and
// splice the untouched tail back on, instead of a full search to the destination.
//
// ON. The technique is what HERE ships as returnToRoute() and TomTom as continuous replanning,
// and upstream OsmAnd's own issue #19737 says it "could be near instantaneous" with HH.
//
// The failure mode this has to survive is not a crash - it is a route that looks perfect on the
// map and speaks the WRONG TURN at a real junction, because the reused tail's turn types were
// computed against a predecessor segment the splice replaced. Three mechanisms answer that, and
// they are in the code rather than in this comment: the tail is deep-copied so a rejected repair
// cannot rewrite the live route, RouteResultPreparation.prepareResult is re-run over the WHOLE
// spliced list so every turn is recomputed from geometry, and the joint is verified to within a
// metre because validateAllPointsConnected only prints and returns.
//
// Every gate falls back to the unchanged full search: not a deviation, intermediates present, a
// GPX route, upstream having discarded the previous route, three consecutive rejected repairs,
// less than a cutoff of route remaining, an absolute cap of 2500 m, a detour ratio of 3.0, a
// joint gap over 1 m, or any Throwable. The worst case is one wasted short search.
//
// CD_REROUTE reports `repair USED`, `repair REJECTED <reason>` or `repair SKIPPED`, and
// CD_REROUTE finished carries repaired=true|false. Set CAIRODRIVE_ROUTE_REPAIR=false to build
// the full-search behaviour.
// P9. Baseline Profile.
//
// ART interprets bytecode until a method is hot enough to JIT. A baseline profile names classes
// and methods to compile at INSTALL time, so the first run is already native. Google's own Maps
// case study reports ~30% off startup, and startup here is the thing the head unit waits on.
//
// androidx.profileinstaller is what actually applies the profile on devices that do not get it
// through Play's install-time pipeline. Without it the file ships and does nothing.
//
// baseline-prof.txt is HAND-AUTHORED against this fork's real critical path - application start,
// the initialiser chain the first car frame waits on, the Android Auto surface path, routing, and
// the CairoDrive classes that sit on every fix and every frame. Generating it properly needs a
// macrobenchmark module and a physical phone; ART ignores rules that do not match, so a reasoned
// profile is strictly better than none and strictly worse than a measured one.
// ITEM 6. Speculative precompute - work out the reroute BEFORE the driver misses the turn.
//
// Affordable only because item 4 exists. A full 8 km search per junction is ~13% duty cycle on one
// of this phone's two big cores, continuously, on a device already at 46.9 ms/frame - which is why
// this was blocked for so long. A 600 m repair is a different order of cost.
//
// This is the one place an offline app can genuinely beat Google rather than catch up. Google pays
// per routing query, so speculation is a line item on a bill - Mapbox's own alternatives feature
// runs on a 5-minute interval for exactly that reason. Here it costs CPU and nothing else.
//
// Serialised on the SAME executor as real calculations, never a second thread: BinaryMapIndexReader
// holds one RandomAccessFile with a mutable stream position, so two concurrent Java-side searches
// corrupt each other. It bails the moment a real calculation is queued, runs at most once every
// 45 s, and its result expires after 2 minutes or 120 m of miss distance.
//
// CD_SPECULATE reports `precomputed`, `HIT` (a reroute served with no search at all), `discarded
// stale` or `discarded missM=`.
// B2. Place-detail pane on Android Auto.
//
// There was no place-detail view on the head unit AT ALL - tapping a search result went straight
// to route preview, so a place's address, category and distance had nowhere to appear. That also
// blocks the deferred Google Places fields (hours, phone, rating, photos): they have nowhere to
// render until this exists.
//
// Built inside MapWithContentTemplate rather than a bare PaneTemplate, because a bare pane inside
// a navigation session tears down the map surface. The camera is deliberately not moved, so there
// is no tilt reset and no restore animation per dismissal. Exactly two secondary lines, which is
// the Android Auto cap while driving.
//
// CD_AUTO reports which address fallback won. Cairo OSM frequently has no addr:* tags, so a drive
// full of addr=coords says the DATA is thin rather than the screen being broken.
// B3. The glance style - a map tuned for looking at once at speed, not for browsing.
//
// Named GLANCE and not DRIVING on the patch author's advice: CAIRODRIVE_DRIVING_VIEW already
// exists and means the tilted camera. Confusing the two in a build log is exactly the kind of
// thing that wastes a drive.
//
// Applied by patches/cairodrive_driving_style.py to the OsmAnd-resources checkout. It injects a
// rendering property `cairodriveDriving`, OFF by default, and gates three changes on it:
//   - car POI suppression no longer stops at z17 (58 rules). Upstream already hides benches,
//     trees, power poles, barriers, shops and office labels for the car profile - then hands them
//     ALL back above z17, which is precisely the junction-approach zoom OsmAnd's auto-zoom pushes
//     into as you slow down. The maxzoom cap is an artifact, not the judgement;
//   - house numbers off in car mode (1 rule). Dozens of numbers per frame in mapped Cairo blocks;
//   - POI label ink collapsed to one grey pair at z15+ (24 groups). The text section carries 119
//     distinct label colours as a category code. Useful when browsing, useless at 60 km/h.
//
// OFF BY DEFAULT AND IT MUST STAY OFF FOR THE B1 DRIVE. A style change and a render-path change
// move the same CD_FRAME numbers and cannot be separated in one log.
//
// The gate is a rendering property, not a BuildConfig field, so it is toggleable mid-drive from
// Configure map - which means one drive can A/B it per 200-frame window instead of costing two.
// CD_FRAME reports glanceStyle= for exactly that reason.
// N7. An early manoeuvre-only cue when the full prompt cannot finish before the junction.
//
// Upstream fires STATE_TURN_NOW at a fixed lead TIME - 6.7 s of travel for a car at any speed -
// and nothing anywhere accounts for how long the sentence takes to SAY. VOICE_PROMPT_DELAY looks
// like latency compensation but is not: it is silence prepended to the utterance, and
// isDistanceLess already pads the trigger by speed x delay, so it cancels exactly. The speech
// itself is compensated nowhere. "turn right onto <long Arabic street name>" can still be
// talking as the junction passes.
//
// STRICTLY ADDITIVE, and that is the whole design constraint. CLAUDE.md records that the last
// attempt at this MOVED the only close-in prompt instead of adding one and left ~40 s of silence
// before a turn. This adds a short "turn right" ahead of the existing prompt when the arithmetic
// says the existing one will still be speaking at the junction, and never moves, delays or
// suppresses anything. Every non-firing outcome is silence, never a relocated prompt.
//
// Proven rather than asserted: 143,616 simulated cases across 5-140 km/h, four prompt delays,
// both scripts and 10-140 character utterances, including 3 s GPS gaps. Zero violations of
// "fires outside the turn-now trigger", "finishes before the turn-now trigger" and "starts after
// the turn-in prompt ended".
//
// The speech-duration model starts from published speech-rate figures and then CALIBRATES on the
// device, because the phone that would validate the priors is the phone running the code:
// utterance start/end are timed end-to-end and folded into a per-script rate. CD_VOICE reports
// turnLead= and ttsSample=.
def speechLeadEnv = System.getenv("CAIRODRIVE_SPEECH_LEAD")
def speechLead = speechLeadEnv?.trim() ? speechLeadEnv.trim() : "true"

def glanceStyleEnv = System.getenv("CAIRODRIVE_GLANCE_STYLE")
def glanceStyle = glanceStyleEnv?.trim() ? glanceStyleEnv.trim() : "false"

def placeDetailsEnv = System.getenv("CAIRODRIVE_PLACE_DETAILS")
def placeDetails = placeDetailsEnv?.trim() ? placeDetailsEnv.trim() : "true"

def speculateEnv = System.getenv("CAIRODRIVE_SPECULATE")
def speculate = speculateEnv?.trim() ? speculateEnv.trim() : "true"

def baselineProfileEnv = System.getenv("CAIRODRIVE_BASELINE_PROFILE")
def baselineProfile = baselineProfileEnv?.trim() ? baselineProfileEnv.trim() : "true"

def routeRepairEnv = System.getenv("CAIRODRIVE_ROUTE_REPAIR")
def routeRepair = routeRepairEnv?.trim() ? routeRepairEnv.trim() : "true"

def alternateAltEnv = System.getenv("CAIRODRIVE_ALTERNATE_ALTERNATIVES")
def alternateAlternatives = alternateAltEnv?.trim() ? alternateAltEnv.trim() : "true"

def lockExternalApiEnv = System.getenv("CAIRODRIVE_LOCK_EXTERNAL_API")
def lockExternalApi = lockExternalApiEnv?.trim() ? lockExternalApiEnv.trim() : "true"

def presentationEnv = System.getenv("CAIRODRIVE_PRESENTATION")
def presentation = presentationEnv?.trim() ? presentationEnv.trim() : "true"

def renderScaleEnv = System.getenv("CAIRODRIVE_RENDER_SCALE")
def renderScale = renderScaleEnv?.trim() ? renderScaleEnv.trim() : "1.0"

// Keep bulk transfers off a metered connection unless the user asks for them explicitly.
// This fork is driven on Egyptian mobile data, where an unattended download is a bill rather
// than an inconvenience, and CAIRODRIVE_UNLOCK_PRO hands the user features - weather most of
// all - that fetch tiles on their own. See CairoDriveDataSaver.
def dataSaverEnv = System.getenv("CAIRODRIVE_DATA_SAVER")
def dataSaver = dataSaverEnv?.trim() ? dataSaverEnv.trim() : "true"

// On by default for BOTH build types now. The release build is what gets installed from
// Play, which Android Auto requires, and this fork's release track is internal testing with
// one user - so the signed build has to log too, or a head-unit drive produces nothing.
// Set CAIRODRIVE_FULL_LOGGING=false at build time before any *public* production release: a
// build that continuously records GPS to storage needs a privacy disclosure on a public
// listing. The logs live in app-scoped external storage (Android/data), auto-deleted on
// uninstall - see CairoDriveLogger.resolveLogDirectory.
def fullLogging = System.getenv("CAIRODRIVE_FULL_LOGGING")
def debugLogging = fullLogging?.trim() ? fullLogging.trim() : "true"
def releaseLogging = fullLogging?.trim() ? fullLogging.trim() : "true"

// Escaped and quoted because buildConfigField takes a Java literal, not a bare string.
def placesKey = System.getenv("GOOGLE_PLACES_API_KEY")?.trim() ?: ""
def placesKeyLiteral = "\"" + placesKey.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
if (placesKey) {
	logger.lifecycle("CairoDrive: Google Places search enabled (key supplied via GOOGLE_PLACES_API_KEY)")
} else {
	logger.lifecycle("CairoDrive: GOOGLE_PLACES_API_KEY not set, falling back to offline OSM search")
}

android {
	sourceSets {
		// Same source set composition as nightlyFree: the Google in-app purchase
		// implementation plus the self-updating "OsmAnd~" contribution screens.
		cairodrive {
			java.srcDirs = ["src-google", "src-osmand"]
			manifest.srcFile "AndroidManifest-cairodrive.xml"
		}
	}

	productFlavors {
		cairodrive {
			dimension "version"
			applicationId "com.cairodrive.app"
			resValue "string", "app_name", "CairoDrive"
			resValue "string", "app_edition", System.getenv("APP_EDITION") ? System.getenv("APP_EDITION") : ""

			// Ship two languages instead of 117. res/values-*/ is 41 MB of translations and
			// ALL of it lands in every install, because upstream disables Play's language
			// splitting (build.gradle: bundle { language { enableSplit = false } }) - and that
			// is correct, not an oversight: OsmAnd has an in-app language selector independent
			// of the system locale, so a split would leave a chosen-but-not-installed language
			// showing untranslated text.
			//
			// resConfigs solves the same problem from the other end and without that hazard: the
			// languages are dropped at BUILD time, so the selector only ever offers what is
			// actually present. This is an Egypt-focused fork with an Arabic-speaking user base,
			// so English and Arabic is the honest list. Add a code here to bring one back.
			//
			// Deliberately NOT paired with shrinkResources. That one is genuinely dangerous
			// here: this app resolves resources by name at runtime via getIdentifier in 20
			// places, R8 cannot see those references, and it would strip icons and rendering
			// styles that are very much in use. Upstream leaves it off for the same reason.
			resConfigs "en", "ar"
		}
	}

	buildTypes {
		debug {
			buildConfigField "boolean", "CAIRODRIVE_FULL_LOGGING", debugLogging
			buildConfigField "String", "GOOGLE_PLACES_API_KEY", placesKeyLiteral
			buildConfigField "boolean", "CAIRODRIVE_UNLOCK_PRO", proUnlocked
			buildConfigField "boolean", "CAIRODRIVE_DRIVING_VIEW", drivingView
