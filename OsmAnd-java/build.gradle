apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'ivy-publish'

configurations {
	android
}

tasks.withType(JavaCompile).configureEach {
	sourceCompatibility = "17"
	targetCompatibility = "17"
}

tasks.register('collectRoutingResources', Sync) {
	from "../../resources/routing"
	into "src/main/resources/net/osmand/router"
	include "*.xml"
}

tasks.register('collectMiscResources', Copy) {
	into "src/main/resources/net/osmand/osm"
	from("../../resources/obf_creation") {
		include "rendering_types.xml"
	}
	from("../../resources/poi") {
		include "poi_types.xml"
	}
	from("../../resources/poi") {
		include "activities.json"
	}
}

tasks.register('collectRenderingStylesResources', Sync) {
	from "../../resources/rendering_styles"
	into "src/main/resources/net/osmand/render"
	include "*.xml"
}

tasks.register('collectRegionsInfoResources', Download) {
	src 'https://builder.osmand.net/basemap/regions.ocbf'
	dest 'src/main/resources/net/osmand/map/regions.ocbf'
	onlyIfModified true
}


tasks.register('collectTestPhrasesResources', Copy) {
	into "src/test/resources/phrases/en/"
	from("../OsmAnd/res/values") {
		include "phrases.xml"
	}
}

tasks.register('collectTestResources', Copy) {
	delete fileTree("src/test/resources/search")
	into "src/test/resources/"
	from("../../resources/test-resources") {
		include "*"
		include "/search/*"
		include "/routing/*"
		include "/approximation/*"
	}
	from("../../resources/poi") {
		include "poi_types.xml"
	}
}

processResources {
	dependsOn collectRoutingResources,
		collectRenderingStylesResources,
		collectRegionsInfoResources,
		collectMiscResources
}

processTestResources {
	dependsOn collectTestResources, collectTestPhrasesResources
}

tasks.register('collectExternalResources') {
	dependsOn collectRoutingResources,
			collectRenderingStylesResources,
			collectRegionsInfoResources,
			collectTestResources,
			collectTestPhrasesResources,
			collectMiscResources
}

tasks.register('androidJar', Jar) {
	if (!project.hasProperty('osmandCoreSimple')) {
		dependsOn collectExternalResources, build
	} else {
		dependsOn build
	}
	archiveAppendix = "android"
	from(sourceSets.main.java.classesDirectory) {
		exclude("**/PlatformUtil.*")
	}
	from sourceSets.main.resources
}

compileJava {
	if (!project.hasProperty('osmandCoreSimple')) {
		dependsOn collectExternalResources
	}
}

artifacts {
	android androidJar
}

version = System.getenv("OSMAND_BINARIES_IVY_REVISION") ?: "master-snapshot"
publishing {
	repositories {
		ivy {
			url = System.getenv("OSMAND_BINARIES_IVY_ROOT") ?: "./"
		}
	}
    publications {
        maven(MavenPublication) {
			artifactId "osmand-base"
            from components.java
        }
		ivyJava(IvyPublication) {
			artifact androidJar {
				archiveClassifier = 'android'
			}
		}
	}
}

// The routing tests are WALL-CLOCK timed - RouteTestingTest declares @Test(timeout = 1500) and
// each case runs up to three full route calculations inside it. That budget is only meaningful if
// the JVM running it is not being squeezed by something else.
//
// Every test in this module shares ONE forked JVM, and Gradle's default heap for a test JVM is
// 512 MB - the `org.gradle.jvmargs=-Xmx6g` that CI writes applies to the Gradle DAEMON, not to
// this fork. The search tests in the same JVM now exercise the spatial pipeline that arrived with
// the upstream merge, and 74. "HH-routing via roadblock" began timing out on the first build after
// that merge. Re-running the last pre-merge commit on the same day PASSED, which rules out the
// runner being slow and rules out the routing code, the test, and its data - none of which changed.
//
// Stated honestly: heap pressure is the best-supported explanation, not a proven one. There is no
// OutOfMemoryError in the log, and the per-test timings that would settle it live in an artifact
// this environment cannot fetch. What is certain is that a timed test sharing an unbounded-demand
// JVM with unrelated tests is an unmanaged variable, and this removes it.
//
// Not forkEvery = 1: a fresh JVM per class would isolate the tests but start each one in the
// interpreter, and losing JIT warmup on a compute-heavy routing test could push it FURTHER over
// its 1.5 s budget. Isolating memory without discarding warmup is the change that can only help.
tasks.withType(Test).configureEach {
	maxHeapSize = "2g"
}

dependencies {
	implementation project(path:':OsmAnd-shared', configuration : gradle.ext.java_shared_conf)

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.hamcrest:hamcrest-core:1.3'
	implementation group: 'commons-logging', name: 'commons-logging', version: '1.2'
	implementation 'com.google.code.gson:gson:2.8.9'
	implementation group: 'org.json', name: 'json', version: '20171018'
	implementation 'org.apache.commons:commons-compress:1.17'
	implementation 'com.moparisthebest:junidecode:0.1.1'
	implementation 'com.vividsolutions:jts-core:1.14.0'
	implementation 'com.google.openlocationcode:openlocationcode:1.0.4'
	implementation ('com.github.scribejava:scribejava-apis:7.1.1') {
		exclude group: "com.fasterxml.jackson.core"
	}
	// turn off for now
	//implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
	implementation 'net.sf.kxml:kxml2:2.1.8'
	implementation fileTree(include: ['*.jar'], dir: 'libs')
}

