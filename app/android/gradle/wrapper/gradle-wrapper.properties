distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Gradle 8.x is required, independently of the AGP pin in settings.gradle.kts.
# Gradle 9 raised its Kotlin DSL script compiler to 2.2.x, which no longer
# resolves the `this@Build_gradle` label form that magiclane_maps_flutter's
# build script uses (verified: a minimal script with no AGP on the classpath
# reproduces "Unresolved label." on 9.3.1 and compiles clean on 8.14.3).
# 8.14.3: Flutter 3.47.0 hard-errors below Gradle 8.14.0, and AGP 8.13 requires
# Gradle >= 8.13, so 8.14.x is the only band satisfying both.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
