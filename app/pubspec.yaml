name: cairodrive
description: CairoDrive — navigation for Cairo, with Google Places search.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.1"

dependencies:
  flutter:
    sdk: flutter

  # CairoDrive's own provider-agnostic search layer (pure Dart, unit-tested).
  cairodrive_search:
    path: ../packages/cairodrive_search

  # Map rendering, routing and navigation engine — the same engine identified
  # in reports/DEEP-RECON-REPORT.md, used here through its published SDK.
  magiclane_maps_flutter: ^3.1.11

  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
